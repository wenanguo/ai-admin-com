# ============================================================
# AiAdmin 前端 —— nginx 主配置（**http 层**）
#
#   站点（server 块）在 `docker/web/templates/default.conf.template` 里 ⇒
#   容器启动时由 nginx 官方镜像的 envsubst 按**环境变量**替换后生成
#   /etc/nginx/conf.d/default.conf（⇒ 上游地址不用重构建镜像就能改）。
#
# ⚠️ 本文件**故意不写 server 块** ⇒ 别把 `location` 加到这里，
#    加到模板里（模板在 docker/web/templates/default.conf.template）。
#
# ⚠️ 本条（issue #40）加了 API 代理；**纯静态托管**的老行为（#38）保持不变。
# ============================================================

user  nginx;
worker_processes  auto;

error_log  /dev/stderr  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ──────────── 日志：进容器日志（docker logs 可见）────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      '$request_time';
    access_log  /dev/stdout  main  buffer=32k  flush=5s;
    error_log   /dev/stderr   warn;

    # ──────────── 基础优化 ────────────
    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;
    keepalive_timeout    65;
    keepalive_requests   1000;
    server_tokens        off;
    client_max_body_size 20m;
    types_hash_max_size  2048;

    # ──────────── gzip ────────────
    gzip           on;
    gzip_vary      on;
    gzip_proxied   any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ──────────── 站点配置（server 块，envsubst 模板生成）────────────
    include /etc/nginx/conf.d/*.conf;
}
