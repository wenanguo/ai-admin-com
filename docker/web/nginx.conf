# ============================================================
# AiAdmin 前端 —— nginx 站点配置（**静态托管**）
#
#   镜像：ai-admin-web（多阶段：node 构建 → nginx 托管 frontend/dist）
#   本文件会**整份替换** /etc/nginx/nginx.conf ⇒ 日志、gzip、安全头都能配。
#
# ⚠️ 本条（issue #38）**只做静态托管**：
#    API 代理（/api/、/ai-api/）是 #C 的活 ⇒ 这里**故意没有** proxy_pass。
# ============================================================

user  nginx;
worker_processes  auto;

error_log  /dev/stderr  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ──────────── 日志：进容器日志（docker logs 可见）────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      '$request_time';
    access_log  /dev/stdout  main  buffer=32k  flush=5s;
    error_log   /dev/stderr   warn;

    # ──────────── 基础优化 ────────────
    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;
    keepalive_timeout    65;
    keepalive_requests   1000;
    server_tokens        off;
    client_max_body_size 20m;
    types_hash_max_size  2048;

    # ──────────── gzip ────────────
    gzip           on;
    gzip_vary      on;
    gzip_proxied   any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    server {
        listen      80;
        server_name _;

        # 前端产物（构建阶段拷进来的 frontend/dist）
        root  /usr/share/nginx/html;
        index index.html;

        # 安全头（片段；自带 add_header 的 location 也要 include，见片段里的说明）
        include /etc/nginx/snippets/security-headers.conf;

        # ──────────── 健康检查 ────────────
        # 内容固定 ⇒ 不含版本号 / 提交号等版本敏感信息
        location = /healthz {
            access_log   off;
            default_type application/json;
            add_header   Cache-Control "no-store" always;
            include      /etc/nginx/snippets/security-headers.conf;
            return 200 '{"status":"ok"}';
        }

        # ──────────── 壳：不缓存 ────────────
        # index.html 缓存 ⇒ 发新版后用户拿旧壳（老 JS + 新页面 ⇒ 白屏）
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            include    /etc/nginx/snippets/security-headers.conf;
        }

        # ──────────── 显式 /assets/ 前缀 ────────────
        # ⚠️ 本仓当前产物是**扁平**的（hash 文件名直接躺在 dist/ 根，没有 assets/ 目录）
        #    ⇒ 这条现在命中不到；留着是为了产物布局切到 assets/ 时不用改配置。
        location ^~ /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include    /etc/nginx/snippets/security-headers.conf;
            try_files  $uri =404;
        }

        # ──────────── 带扩展名的静态资源：长缓存 ────────────
        # 这条才是本仓**真正生效**的长缓存规则（产物扁平在根，文件名带 hash）
        location ~* \.(?:js|mjs|css|map|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot)$ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include    /etc/nginx/snippets/security-headers.conf;
            try_files  $uri =404;
        }

        # ──────────── SPA fallback ────────────
        # 任意前端路由（/pm/task …）直接刷新 ⇒ 回落到根 index.html，不 404
        # ⚠️ 刻意**不写** `$uri/`：带尾斜杠的目录请求才会命中 umi exportStatic
        #    预渲染出来的那份 `pm/task/index.html`（同一套壳）；
        #    不带尾斜杠的 `/pm/task` 精确回落到根 index.html（与验收标准字面一致）。
        location / {
            try_files $uri /index.html;
        }
    }
}
