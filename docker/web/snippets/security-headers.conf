# ============================================================
# 安全头片段（被 nginx.conf 的 server 与各 location 反复 include）
#
# ⚠️ **为什么要做成片段**：
#    nginx 语义 —— 只要 location 里出现了自己的 `add_header`，
#    **父级（server/http）的 add_header 会被整体丢弃**（不是合并！）。
#    ⇒ 只在 server 里写一遍安全头是不够的：凡是自带 add_header 的
#      location（/index.html、/assets/、静态资源正则、/healthz）
#      都得自己 include 一遍，否则那些响应没有安全头。
# ============================================================

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
