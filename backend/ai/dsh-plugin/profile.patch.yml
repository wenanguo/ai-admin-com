# 我们的 dsh profile 补丁 —— **把我们的插件插进 profile**。
#
# ⚠️ dsh 的 profile 是一份**配置树**；插件本体要能被 profile 解析到
#    ⇒ 还得把它 `pnpm add file:<我们的插件路径>` 装进那个 profile 工程
#    （见 `core/adapter/dsh/profile.ts` 的 `ensureDshProfile`）。
#
# ⚠️ **插件的配置全走环境变量**（路由 / baseURL / key / 提示词 / 工具目录）
#    ⇒ 这份补丁里没有配置项 ⇒ **凭据不落盘**。
- insert:
    - id: ai-admin
      name: '@ai-admin/dsh-plugin'

# ⚠️ **模型路由不在这里**（issue #168 · D5=B）。
#
#    provider 归位给 **dsh 自带的** `@deepseek-ai/dsh-llm-pi-ai` ⇒ 它**默认就挂着**
#    （dsh-base 的 profile 里那一段 `llm-pi-ai`）⇒ **不用再关它**。
#    路由（baseURL / 模型 / key 的**变量名**）由**我们生成另一段补丁**喂给它
#    （见 `core/adapter/dsh/profile.ts` 的 `writePiAiProviderPatch`）
#    ⇒ **凭据只写变量名** ⇒ 密钥不落盘。

# ⚠️ **技能目录按会话给**（issue #153：技能退给 dsh）。
#
#    dsh 自带的技能子系统（`dsh-skill` + `dsh-skill-filesystem` + `dsh-tool-skill`）
#    **本来就挂在 sdk profile 里** ⇒ 我们**不再自己扫技能**
#    （`core/skills/skill-loader.ts` 那套已删）⇒ 技能发现、目录、正文加载
#    全部是 dsh 的事。
#
#    ⚠️ **默认根一律不扫**（`includeDefaultRoots: false`）：
#    dsh 的默认根 = `<项目根>/.dsh/skills` + `<项目根>/.agents/skills`
#    + `<dsh home>/skills` + `<用户家目录>/.agents/skills`
#    ⇒ 会把**仓库自己的开发技能**（`.agents/skills/antd` 等）与
#    **开发者私人技能**混进业务会话 ⇒ 必须关掉。
#    ⇒ 技能目录**只认智能体配置里列的那几个**（`agent.yaml` 的 `skills`）
#    ⇒ **不跨智能体串味**（与 `docs/notes/2026-11-16-skills-per-agent.md` 同口径）。
#
#    ⚠️ **目录从环境变量来**（`AI_DSH_SKILL_DIRS`：base64 的 JSON 数组）
#    ⇒ 每个 dsh 子进程（= 一个会话）一份 ⇒ 由 `core/adapter/dsh/runner.ts` 算好。
#    ⇒ 插件的 `!!js` 表达式在 **dsh 进程里**求值 ⇒ 拿得到那个环境变量。
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false
    customSkillDirs: !!js "process.env.AI_DSH_SKILL_DIRS ? JSON.parse(Buffer.from(process.env.AI_DSH_SKILL_DIRS, 'base64').toString('utf8')) : []"
