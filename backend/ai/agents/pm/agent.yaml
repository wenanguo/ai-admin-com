# 智能体配置（一个智能体一个目录）
#
# ⚠️ 这个文件**由人编辑**（本服务没有创建/修改配置的接口）。
#    改完**重启 AI 服务**生效。
#
# ⚠️ **非法配置 ⇒ 启动即报错**（不会静默忽略）：缺字段、类型错、
#    引用的目录/文件不存在 ⇒ 服务起不来，报错里点名是哪个字段。
#
# 字段说明见 `backend/ai/src/core/config/schema.ts`，
# 格式说明见 `backend/ai/agents/README.md`。

id: pm
name: PM 助手
description: 项目管理助手：把需求拆成任务、管里程碑、写回任务状态。

# 模型（可省 ⇒ 用全局默认 `env.AI_MODEL`）
# model: minimax-cn/MiniMax-M3.1-Flash

# 系统提示词：**二选一**（systemPrompt 直接写 / systemPromptFile 指向文件）
# ⚠️ 这份提示词**原来写在代码里**（`src/agent/prompt.ts`）⇒ 现在搬到这里，
#    内容**一字未改** ⇒ 行为不变（issue #78 的验收标准）。
systemPromptFile: prompt.md

# 技能目录（相对**本配置目录**；目录不存在 ⇒ 启动即报错）
# ⚠️ `../../.pi/skills` = `backend/ai/.pi/skills`（本服务的项目技能目录）
#    ⇒ **只有这份配置领用它们**（别的智能体没列 ⇒ 看不到）
#    ⚠️ pi 默认会扫 `.pi/skills` 与用户家目录 ⇒ 我们**一律不加载**（只加载这里列的目录）
skills:
  - ../../.pi/skills

# MCP 服务器（工具的来源；`url` 可省 ⇒ 用全局默认 `env.AIADMIN_MCP_URL`）
mcpServers:
  - name: aiadmin

# 工具白名单（只放行这些**我们自己的**命令工具）
# ⚠️ 这里放的是**插件命令的名字**，不是 MCP 工具的名字 ⇒
#    MCP 的工具（模型侧叫 mcp__aiadmin__xxx）**不受这份白名单管**
#    （它们由上面的 mcpServers 决定挂不挂）。
# ⚠️ 我们的建任务命令叫 `pm_create_task`（**不叫** `create_task`——
#    那是 AiAdmin 后端 MCP 那个工具的裸名 ⇒ 同名两义会让模型挑错，issue #182）。
tools:
  - pm_create_task

# 用哪个**业务插件**（内核按名字去注册表取 ⇒ 内核不 import 插件）
# ⚠️ 写错名字 ⇒ 启动即失败（不静默降级成「没有命令」）
plugin: pm
