# 智能体配置（一个智能体一个目录）
#
# ⚠️ 这个文件**由人编辑**（本服务没有创建/修改配置的接口）。
#    改完**重启 AI 服务**生效。
#
# ⚠️ **非法配置 ⇒ 启动即报错**（不会静默忽略）：缺字段、类型错、
#    引用的目录/文件不存在 ⇒ 服务起不来，报错里点名是哪个字段。
#
# 字段说明见 `backend/ai/src/core/config/schema.ts`，
# 格式说明见 `backend/ai/agents/README.md`。

id: sample
name: 示例智能体
description: 演示「一份 YAML 描述一个智能体」长什么样。

# 模型（可省 ⇒ 用全局默认 `env.AI_MODEL`）
model: minimax-cn/MiniMax-M3.1-Flash

# 系统提示词：**二选一**（systemPrompt 直接写 / systemPromptFile 指向文件）
systemPromptFile: prompt.md

# 技能目录（相对**本配置目录**；目录不存在 ⇒ 启动即报错）
skills: []

# MCP 服务器（工具的来源；`url` 可省 ⇒ 用全局默认）
mcpServers:
  - name: aiadmin

# 工具白名单（只放行这些**我们自己的**命令工具）
# ⚠️ 这里写的是**插件命令的名字**（不是 MCP 工具的名字 ⇒ 那些由上面的 mcpServers 决定挂不挂）。
# ⚠️ **名字必须是真的**（某个插件声明的命令，如 `pm_create_task`）
#    ⇒ 写错 ⇒ 工具**静默不注册** ⇒ 模型看不到它（**不报错、不告警**）
#    ⇒ 有守卫盯着：node scripts/e2e/agent-tools-whitelist.static.cjs（CI 里也跑）。
# ⚠️ 这个示例智能体**没有自己的插件命令** ⇒ 白名单留空 ⇒ 一个工具都没有（= 界面上的「工具数 0」）。
tools: []
