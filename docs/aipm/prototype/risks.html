<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>风险登记册 · aicomm</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/partials.js"></script>
  <script src="assets/js/app.js"></script>
</head>
<body>
  <div id="app" class="h-screen flex"></div>
  <div id="ai-fab"></div>

  <script>
    const risks = window.MOCK.risks;

    // 渲染 AI 候选风险
    (function renderSuggestions() {
      const box = document.getElementById('risk-suggestions');
      if (!box) return;
      const list = (window.MOCK && MOCK.riskSuggestions) ? MOCK.riskSuggestions : [];
      const lvTag = l => l === '高' ? 'danger' : l === '中' ? 'warning' : 'info';
      const lvBorder = l => l === '高' ? 'border-red-200 bg-red-50' : l === '中' ? 'border-orange-200 bg-orange-50' : 'border-gray-200 bg-gray-50';
      box.innerHTML = list.map(sg => `
        <div class="p-3 border rounded ${lvBorder(sg.level)}">
          <div class="flex items-center gap-1.5 mb-1">
            <span class="el-tag ${lvTag(sg.level)}">${sg.category} · ${sg.level}</span>
            <strong class="text-xs">${sg.title}</strong>
          </div>
          <div class="text-gray-600 text-xs">${sg.detail}</div>
          <div class="mt-1 text-blue-600 text-xs font-medium">→ ${sg.action}</div>
          <div class="mt-2 flex gap-1.5">
            <button class="px-2 py-1 bg-blue-500 text-white rounded text-[11px]" onclick="window.__aipmAdoptRisk('${sg.id}')">采纳并登记</button>
            <button class="px-2 py-1 border border-gray-300 rounded text-[11px]" onclick="window.__aipmAsk('针对风险「${sg.title}」给出应对方案，并创建应对任务')">✦ 让 AI 处理</button>
            <button class="px-2 py-1 text-gray-400 text-[11px]" onclick="this.closest('.p-3').remove()">忽略</button>
          </div>
        </div>`).join('');
    })();

    // 计算热力图格子
    function heatColor(prob, impact) {
      const score = prob * impact;
      if (score >= 16) return 'extreme';
      if (score >= 9) return 'high';
      if (score >= 4) return 'medium';
      return 'low';
    }
    function heatCellHtml(prob, impact) {
      const count = risks.filter(r => r.probability === prob && r.impact === impact).length;
      const score = prob * impact;
      const cls = count ? heatColor(prob, impact) : 'empty';
      return `<div class="heat-cell ${cls}" title="概率${prob}/影响${impact} · score ${score}">${count || ''}</div>`;
    }

    aicomLayout(`
    <div class="p-6 space-y-4 bg-gray-50">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-xl font-semibold flex items-center gap-2">
            <i data-lucide="alert-triangle" class="w-5 h-5 text-red-500"></i> 风险登记册
            <span class="ml-2 el-tag danger">3 红旗</span>
          </h1>
          <div class="text-xs text-gray-500 mt-1">5x5 概率-影响热力图 · 当前 8 条风险 · AI 自动识别 3 条</div>
        </div>
        <div class="flex gap-2">
          <button class="btn btn-default btn-sm"><i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>AI 重扫</button>
          <button class="btn btn-default btn-sm"><i data-lucide="download" class="w-3.5 h-3.5"></i>导出</button>
          <button class="btn btn-primary btn-sm"><i data-lucide="plus" class="w-3.5 h-3.5"></i>登记风险</button>
        </div>
      </div>

      <!-- 筛选 -->
      <div class="card flex items-center gap-3 text-xs">
        <span class="text-gray-500 font-medium">筛选：</span>
        <select class="el-input" style="width:auto"><option>全部项目</option><option>财务对账系统</option></select>
        <select class="el-input" style="width:auto"><option>全部状态</option><option>已识别</option><option>缓解中</option></select>
        <select class="el-input" style="width:auto"><option>全部类别</option><option>schedule</option><option>quality</option><option>resource</option></select>
        <span class="ml-auto text-gray-500">最后扫描：2026-06-30 02:30 (cron)</span>
      </div>

      <!-- AI Coach banner -->
      <div class="bg-gradient-to-r from-red-50 to-orange-50 border border-red-200 rounded p-3 flex items-start gap-3 text-sm">
        <div class="w-9 h-9 rounded-full bg-gradient-to-br from-red-500 to-orange-500 flex items-center justify-center text-white"><i data-lucide="sparkles" class="w-4 h-4"></i></div>
        <div class="flex-1">
          <div class="font-medium flex items-center gap-2">AI 风险预警 · 5 类规则层告警 <span class="el-tag purple">今日 3 条</span></div>
          <ul class="text-xs text-gray-600 mt-1 space-y-0.5">
            <li>• <strong>延期类</strong>：营销活动平台任务 #3002 已逾期 5 天（score 20）</li>
            <li>• <strong>阻塞类</strong>：预付款幂等任务 #1003 已阻塞 3 天</li>
            <li>• <strong>过载类</strong>：王芳同时负责 3 个 P0 项目，建议拆分</li>
          </ul>
        </div>
        <div class="flex gap-1.5"><button class="btn btn-default btn-sm">查看详情</button></div>
      </div>

      <div class="grid grid-cols-3 gap-4">
        <!-- 5x5 热力图 -->
        <div class="card col-span-2">
          <div class="card-title">
            <i data-lucide="grid-3x3" class="w-4 h-4 text-blue-500"></i> 5x5 风险热力图（行=概率 / 列=影响）
            <div class="ml-auto flex items-center gap-3 text-xs text-gray-500">
              <span class="flex items-center gap-1"><span class="w-3 h-3 rounded" style="background:#67C23A"></span>低</span>
              <span class="flex items-center gap-1"><span class="w-3 h-3 rounded" style="background:#E6A23C"></span>中</span>
              <span class="flex items-center gap-1"><span class="w-3 h-3 rounded" style="background:#F56C6C"></span>高</span>
              <span class="flex items-center gap-1"><span class="w-3 h-3 rounded" style="background:#C03639"></span>极高</span>
            </div>
          </div>

          <div class="flex">
            <div class="w-20 pt-7">
              <div class="text-xs font-medium mb-1 text-gray-500">概率 ↓</div>
              ${[5,4,3,2,1].map(p => `<div class="h-12 flex items-center justify-center text-xs text-gray-500">${p} (高)</div>`).join('')}
            </div>
            <div class="flex-1">
              <div class="text-xs font-medium mb-1 text-gray-500 text-center">影响 →</div>
              <div class="grid grid-cols-5 gap-0">
                ${[1,2,3,4,5].map(impact => [5,4,3,2,1].map(prob => heatCellHtml(prob, impact)).join('')).join('')}
              </div>
            </div>
          </div>
          <div class="grid grid-cols-5 gap-0 mt-1 pl-20 pr-2 text-xs text-gray-400 text-center">
            <div>1 低</div><div>2</div><div>3</div><div>4</div><div>5 高</div>
          </div>

          <!-- 分布统计 -->
          <div class="mt-4 grid grid-cols-4 gap-3 text-center text-xs">
            <div class="p-3 bg-red-50 rounded"><div class="kpi-value text-red-500">3</div><div class="kpi-label">高风险（≥16）</div></div>
            <div class="p-3 bg-orange-50 rounded"><div class="kpi-value text-orange-500">3</div><div class="kpi-label">中风险（9-15）</div></div>
            <div class="p-3 bg-yellow-50 rounded"><div class="kpi-value text-yellow-600">2</div><div class="kpi-label">低风险（4-8）</div></div>
            <div class="p-3 bg-green-50 rounded"><div class="kpi-value text-green-500">0</div><div class="kpi-label">已关闭</div></div>
          </div>
        </div>

        <!-- AI 候选风险（规则识别，未入库） -->
        <div class="card mb-4">
          <div class="card-title">
            <i data-lucide="scan-search" class="w-4 h-4 text-purple-500"></i> AI 候选风险
            <span class="ml-auto el-tag purple">规则层自动识别 · 未入库</span>
          </div>
          <div class="space-y-2" id="risk-suggestions"></div>
          <div class="text-[11px] text-gray-400 mt-2 px-1">
            <i data-lucide="info" class="w-3 h-3 inline"></i>
            候选风险只由规则算出，<strong>不会直接写入外部系统</strong>——采纳后进入待确认队列，人点头才登记。
          </div>
        </div>

        <!-- AI Coach 卡片 -->
        <div class="card">
          <div class="card-title"><i data-lucide="bot" class="w-4 h-4 text-purple-500"></i> AI Coach</div>
          <div class="space-y-2 text-xs">
            <div class="p-3 border border-red-200 bg-red-50 rounded">
              <div class="flex items-center gap-1 mb-1">
                <span class="el-tag danger">延期</span>
                <strong>营销活动平台</strong>
              </div>
              <div class="text-gray-600 mt-1">任务 #3002 已逾期 5 天，依赖任务 #3010 受阻塞</div>
              <div class="mt-2 text-blue-600 font-medium">→ 建议增援 1 名设计 / 调整上线日期</div>
            </div>
            <div class="p-3 border border-orange-200 bg-orange-50 rounded">
              <div class="flex items-center gap-1 mb-1">
                <span class="el-tag warning">阻塞</span>
                <strong>财务对账系统</strong>
              </div>
              <div class="text-gray-600 mt-1">任务 #1003 已阻塞 3 天，ERP 接口反复重试</div>
              <div class="mt-2 text-blue-600 font-medium">→ 7/5 前提交 idempotency-key 方案</div>
            </div>
            <div class="p-3 border border-yellow-200 bg-yellow-50 rounded">
              <div class="flex items-center gap-1 mb-1">
                <span class="el-tag warning">过载</span>
                <strong>王芳</strong>
              </div>
              <div class="text-gray-600 mt-1">同时负责 3 个 P0 项目</div>
              <div class="mt-2 text-blue-600 font-medium">→ 建议将合规二期拆分转派</div>
            </div>
            <div class="p-3 border border-blue-200 bg-blue-50 rounded">
              <div class="flex items-center gap-1 mb-1">
                <span class="el-tag primary">范围蔓延</span>
                <strong>客户交付中台</strong>
              </div>
              <div class="text-gray-600 mt-1">B 端客户常追加需求</div>
              <div class="mt-2 text-blue-600 font-medium">→ 设立需求冻结日</div>
            </div>
          </div>
        </div>
      </div>

      <!-- 风险卡片列表 -->
      <div class="card p-0">
        <div class="card-title px-4 pt-4">
          <i data-lucide="list" class="w-4 h-4 text-blue-500"></i> 风险列表
          <span class="ml-auto text-xs text-gray-500">共 8 条</span>
        </div>
        <table class="w-full text-xs">
          <thead class="text-gray-500 bg-gray-50">
            <tr>
              <th class="text-left py-2.5 px-4">风险标题</th>
              <th class="text-left py-2.5 px-4 w-20">类别</th>
              <th class="text-left py-2.5 px-4 w-28">概率/影响</th>
              <th class="text-left py-2.5 px-4 w-12">Score</th>
              <th class="text-left py-2.5 px-4 w-24">状态</th>
              <th class="text-left py-2.5 px-4 w-20">Owner</th>
              <th class="text-left py-2.5 px-4 w-24">截止</th>
              <th class="text-left py-2.5 px-4 w-20">来源</th>
              <th class="text-left py-2.5 px-4 w-16">操作</th>
            </tr>
          </thead>
          <tbody>
            ${risks.map(r => {
              const scoreCls = r.score >= 16 ? 'danger' : r.score >= 9 ? 'warning' : 'success';
              return `
              <tr class="border-t border-gray-100 hover:bg-blue-50/40">
                <td class="py-3 px-4">
                  <div class="font-medium text-gray-800">${r.title}</div>
                  <div class="text-gray-500 mt-0.5">${r.description}</div>
                </td>
                <td class="py-3 px-4"><span class="el-tag">${r.category}</span></td>
                <td class="py-3 px-4 text-gray-600">${r.probability} × ${r.impact}</td>
                <td class="py-3 px-4"><span class="el-tag ${scoreCls}">${r.score}</span></td>
                <td class="py-3 px-4"><span class="status-pill ${r.status === 'mitigating' ? 'in_progress' : r.status === 'analyzing' ? 'review' : r.status === 'closed' ? 'done' : 'todo'}">${r.status}</span></td>
                <td class="py-3 px-4">${window.MOCK.users.find(u=>u.id===r.owner_id).name}</td>
                <td class="py-3 px-4 text-gray-500">${r.due_date}</td>
                <td class="py-3 px-4">${r.created_via === 'ai_suggested' ? '<span class="el-tag purple">AI 识别</span>' : '<span class="text-gray-400">手动</span>'}</td>
                <td class="py-3 px-4"><a href="javascript:;" class="text-blue-500">详情</a></td>
              </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
    `);
    setTimeout(() => { if (window.lucide) lucide.createIcons(); }, 50);
  </script>
</body>
</html>
