<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务列表 · aicomm</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/partials.js"></script>
  <script src="assets/js/app.js"></script>
</head>
<body>
  <div id="app" class="h-screen flex"></div>
  <div id="ai-fab"></div>

  <script>
    const tasks = window.MOCK.tasks;
    const users = window.MOCK.users;
    const projects = window.MOCK.projects;
    function userById(id) { return users.find(u => u.id === id) || { name: '?', avatar: '?', color: '#909399' }; }

    function priorityColor(p) {
      return p === 'P0' ? 'red' : p === 'P1' ? 'orange' : p === 'P2' ? 'blue' : 'gray';
    }

    aicomLayout(`
    <div class="p-6 space-y-4 bg-gray-50">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-xl font-semibold flex items-center gap-2">
            <i data-lucide="list-checks" class="w-5 h-5 text-blue-500"></i> 任务列表
          </h1>
          <div class="text-xs text-gray-500 mt-1">共 24 个任务 · 默认按优先级 + 截止日排序</div>
        </div>
        <div class="flex gap-2">
          <div class="flex border border-gray-200 rounded overflow-hidden">
            <button class="px-3 py-1.5 text-xs bg-white text-gray-600"><a href="task-board.html?from=task-list">看板</a></button>
            <button class="px-3 py-1.5 text-xs bg-blue-500 text-white">列表</button>
            <button class="px-3 py-1.5 text-xs bg-white text-gray-600">甘特</button>
          </div>
          <button class="btn btn-default btn-sm"><i data-lucide="download" class="w-3.5 h-3.5"></i>导出</button>
          <button class="btn btn-primary btn-sm"><i data-lucide="plus" class="w-3.5 h-3.5"></i>新建任务</button>
        </div>
      </div>

      <!-- 多列筛选 -->
      <div class="card">
        <div class="flex items-center gap-3 flex-wrap text-xs">
          <span class="text-gray-500 font-medium">筛选：</span>
          <div class="flex items-center gap-1.5">
            <label class="text-gray-500">状态</label>
            <select class="el-input" style="width:auto"><option>全部</option><option>in_progress (2)</option><option>blocked (1)</option><option>review (1)</option></select>
          </div>
          <div class="flex items-center gap-1.5">
            <label class="text-gray-500">优先级</label>
            <select class="el-input" style="width:auto"><option>全部</option><option>P0 (3)</option><option>P1 (5)</option><option>P2 (3)</option></select>
          </div>
          <div class="flex items-center gap-1.5">
            <label class="text-gray-500">Assignee</label>
            <select class="el-input" style="width:auto"><option>全部</option><option>刘洋 (3)</option><option>赵磊 (2)</option></select>
          </div>
          <div class="flex items-center gap-1.5">
            <label class="text-gray-500">里程碑</label>
            <select class="el-input" style="width:auto"><option>全部</option><option>预付款模块</option><option>开票模块</option></select>
          </div>
          <div class="flex items-center gap-1.5">
            <label class="text-gray-500">标签</label>
            <div class="flex gap-1">
              <button class="el-tag primary">backend</button>
              <button class="el-tag">frontend</button>
              <button class="el-tag">etl</button>
            </div>
          </div>
          <button class="ml-auto text-blue-500 hover:underline">高级筛选</button>
          <button class="text-gray-500 hover:underline">重置</button>
        </div>
      </div>

      <!-- AI 提示 -->
      <div class="bg-gradient-to-r from-purple-50 to-blue-50 border border-purple-200 rounded p-3 flex items-center gap-3 text-sm">
        <i data-lucide="sparkles" class="w-5 h-5 text-purple-500"></i>
        <div class="flex-1">AI 已识别 <strong>1 个延期风险</strong> 任务、<strong>3 个可优化估时</strong> 任务。</div>
        <button class="btn btn-default btn-sm">查看详情</button>
      </div>

      <!-- 列表 -->
      <div class="card p-0">
        <table class="w-full text-xs">
          <thead class="text-gray-500 bg-gray-50">
            <tr>
              <th class="text-left py-3 px-3 w-8"><input type="checkbox"></th>
              <th class="text-left py-3 px-3 w-16">优先级</th>
              <th class="text-left py-3 px-3">任务标题</th>
              <th class="text-left py-3 px-3 w-24">状态</th>
              <th class="text-left py-3 px-3 w-24">Assignee</th>
              <th class="text-left py-3 px-3 w-20">估时/实际</th>
              <th class="text-left py-3 px-3 w-24">截止</th>
              <th class="text-left py-3 px-3 w-28">依赖</th>
              <th class="text-left py-3 px-3 w-20">标签</th>
              <th class="text-left py-3 px-3 w-20">创建方式</th>
              <th class="text-left py-3 px-3 w-16">操作</th>
            </tr>
          </thead>
          <tbody>
            ${tasks.map(t => {
              const u = userById(t.assignee_id);
              return `
              <tr class="border-t border-gray-100 hover:bg-blue-50/40 cursor-pointer" onclick="location.href='comments.html?from=task-list&target=' + ${t.id}">
                <td class="py-2.5 px-3"><input type="checkbox" onclick="event.stopPropagation()"></td>
                <td class="py-2.5 px-3"><span class="font-bold text-${priorityColor(t.priority)}-500">${t.priority}</span></td>
                <td class="py-2.5 px-3">
                  <div class="flex items-center gap-1.5">
                    <span class="font-medium text-gray-800">${t.title}</span>
                    ${t.ai && t.ai.suggested ? '<span class="el-tag purple" style="height:18px;font-size:10px;padding:0 4px"><i data-lucide="sparkles" class="w-2.5 h-2.5 inline"></i>AI</span>' : ''}
                  </div>
                </td>
                <td class="py-2.5 px-3"><span class="status-pill ${t.status}">${t.status}</span></td>
                <td class="py-2.5 px-3"><div class="flex items-center gap-1"><div class="avatar" style="width:20px;height:20px;font-size:10px;background:${u.color}">${u.avatar}</div><span>${u.name}</span></div></td>
                <td class="py-2.5 px-3"><span class="text-gray-700">${t.estimate_hours}h</span>${t.actual_hours ? `<span class="text-green-500 text-[10px] ml-1">/ ${t.actual_hours}h</span>` : ''}</td>
                <td class="py-2.5 px-3 text-gray-500">${t.due_date || '—'}</td>
                <td class="py-2.5 px-3">${(t.dependencies || []).length ? `<span class="text-blue-500 text-[10px] flex items-center gap-0.5"><i data-lucide="link" class="w-3 h-3"></i>${t.dependencies.map(d => '#' + d).join(', ')}</span>` : '—'}</td>
                <td class="py-2.5 px-3"><div class="flex gap-1 flex-wrap">${(t.labels || []).slice(0, 2).map(l => `<span class="el-tag" style="height:18px;font-size:10px;padding:0 4px">${l}</span>`).join('')}</div></td>
                <td class="py-2.5 px-3">${t.ai && t.ai.suggested ? '<span class="el-tag purple">nl_chat</span>' : '<span class="text-gray-400">manual</span>'}</td>
                <td class="py-2.5 px-3 text-gray-400"><i data-lucide="more-horizontal" class="w-4 h-4"></i></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
        <div class="border-t border-gray-100 px-4 py-3 flex items-center text-xs text-gray-500">
          <span>共 12 条</span>
          <div class="ml-auto flex items-center gap-2"><button class="btn btn-default btn-sm">上一页</button><button class="btn btn-primary btn-sm">1</button><button class="btn btn-default btn-sm">下一页</button></div>
        </div>
      </div>

      <!-- 依赖图 -->
      <div class="card">
        <div class="card-title"><i data-lucide="git-branch" class="w-4 h-4 text-blue-500"></i> 任务依赖关系（局部）</div>
        <div class="text-xs text-gray-700 font-mono leading-relaxed">
          <div>　#1001 (预付款 ETL) ──FS──&gt; #1002 (预付款 UI)</div>
          <div>　#1001 ──FS──&gt; #1003 (幂等性设计)</div>
          <div>　#1003 ──FS──&gt; #1007 (运维监控大盘)</div>
          <div>　#2001 (IdP 集群) ──FS──&gt; #2002 (IdP AD 联调)</div>
          <div>　#2001 ──FS──&gt; #2003 (OA SDK 集成) / #2005 (SAML 对接)</div>
        </div>
      </div>
    </div>
    `);
    setTimeout(() => { if (window.lucide) lucide.createIcons(); }, 50);
  </script>
</body>
</html>
