<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目详情 · aicomm</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/partials.js"></script>
  <script src="assets/js/app.js"></script>
</head>
<body>
  <div id="app" class="h-screen flex"></div>
  <div id="ai-fab"></div>

  <script>
    // ====== 数据准备：从 MOCK 聚合 ======
    const allMilestones = window.MOCK.milestones;
    const allTasks = window.MOCK.tasks;
    const allUsers = window.MOCK.users;
    const currentProjectId = 1;

    function userById(id) { return allUsers.find(u => u.id === id) || { name: '?', avatar: '?' }; }
    function getMilestonesOf(pid) { return allMilestones.filter(m => m.project_id === pid); }
    function getTasksOf(mid) { return allTasks.filter(t => t.milestone_id === mid); }

    function aggregate(tasks) {
      const total = tasks.length;
      const done = tasks.filter(t => t.status === 'done').length;
      const in_progress = tasks.filter(t => t.status === 'in_progress').length;
      const blocked = tasks.filter(t => t.status === 'blocked').length;
      const review = tasks.filter(t => t.status === 'review').length;
      const todo = tasks.filter(t => t.status === 'todo').length;
      const backlog = tasks.filter(t => t.status === 'backlog').length;
      const totalHours = tasks.reduce((s, t) => s + (t.estimate_hours || 0), 0);
      const doneHours = tasks.filter(t => t.status === 'done').reduce((s, t) => s + (t.actual_hours || t.estimate_hours || 0), 0);
      const completion = total ? Math.round((done / total) * 100) : 0;
      const aiEtaDays = (!total || done >= total) ? 0 : Math.max(1, Math.round((totalHours - doneHours) / 8));
      return { total, done, in_progress, blocked, review, todo, backlog, totalHours, doneHours, completion, aiEtaDays };
    }

    function statusColor(s) {
      return { done: '#67C23A', in_progress: '#E6A23C', upcoming: '#409EFF', at_risk: '#F56C6C', missed: '#C03639' }[s] || '#909399';
    }
    function completionColor(c) {
      if (c >= 80) return 'green';
      if (c >= 40) return 'blue';
      if (c >= 10) return 'orange';
      return 'red';
    }
    function aiPredictDate(milestone, agg) {
      if (agg.completion === 100) return { date: milestone.due_date, label: '已达成', color: '#67C23A' };
      if (!agg.total) return { date: '—', label: '无任务', color: '#909399' };
      const penalty = agg.blocked * 3 + agg.review * 1;
      const predicted = new Date('2026-06-30');
      predicted.setDate(predicted.getDate() + agg.aiEtaDays + penalty);
      const due = new Date(milestone.due_date);
      const overdue = predicted > due;
      return { date: predicted.toISOString().slice(0, 10), label: overdue ? '⚠️ 预计延期' : '✓ 可按时', color: overdue ? '#F56C6C' : '#67C23A' };
    }

    function statusSegPct(n, total) { return total ? (n / total) * 100 : 0; }

    // 手风琴切换
    window.toggleMSAcc = function(mid) {
      const row = document.getElementById('pd-acc-' + mid);
      const chev = document.getElementById('pd-chev-' + mid);
      if (!row) return;
      const isHidden = row.classList.contains('hidden');
      row.classList.toggle('hidden');
      if (chev) chev.classList.toggle('open', isHidden);
    };

    // 渲染里程碑时间线（带完成情况 + AI 预测 + 手风琴任务列表）
    function renderMilestoneTimeline() {
      const ms = getMilestonesOf(currentProjectId);
      const items = ms.map((m, idx) => {
        const tasks = getTasksOf(m.id);
        const agg = aggregate(tasks);
        const pred = aiPredictDate(m, agg);
        const color = statusColor(m.status);
        const compColor = completionColor(agg.completion);
        const taskRows = tasks.map(t => {
          const u = userById(t.assignee_id);
          const overdue = t.due_date && new Date(t.due_date) < new Date('2026-06-30') && t.status !== 'done';
          return `
            <tr class="border-t border-gray-100 hover:bg-blue-50/30">
              <td class="py-2 px-3 pl-12 text-xs">
                <div class="flex items-center gap-2">
                  <span class="text-gray-400 font-mono">#${t.id}</span>
                  <span class="font-medium text-gray-800">${t.title}</span>
                  ${t.ai && t.ai.suggested ? '<span class="el-tag purple" style="height:16px;font-size:10px;padding:0 4px"><i data-lucide="sparkles" class="w-2.5 h-2.5 inline"></i>AI</span>' : ''}
                  ${overdue ? '<span class="el-tag danger" style="height:16px;font-size:10px;padding:0 4px">延期</span>' : ''}
                </div>
              </td>
              <td class="py-2 px-3"><span class="status-pill ${t.status}">${t.status}</span></td>
              <td class="py-2 px-3">
                <div class="flex items-center gap-1.5">
                  <div class="avatar" style="width:20px;height:20px;font-size:10px">${u.avatar}</div>
                  <span class="text-xs">${u.name}</span>
                </div>
              </td>
              <td class="py-2 px-3 text-xs">${t.estimate_hours || 0}h${t.actual_hours ? `<span class="text-green-500 ml-1">/ ${t.actual_hours}h</span>` : ''}</td>
              <td class="py-2 px-3 text-right"><a href="comments.html?from=project-detail&target=${t.id}" class="text-blue-500 text-xs hover:underline">详情</a></td>
            </tr>`;
        }).join('');

        const emptyState = `
          <div class="text-center text-xs text-gray-400 py-6">
            <i data-lucide="inbox" class="w-6 h-6 inline-block mb-1"></i>
            <div>该里程碑暂无任务</div>
          </div>`;

        return `
          <div class="flex gap-3 py-3 border-b border-gray-100 last:border-0 accordion-toggle" onclick="toggleMSAcc(${m.id})">
            <div class="flex flex-col items-center pt-1">
              <div class="w-3 h-3 rounded-full" style="background:${color}"></div>
              <div class="w-0.5 flex-1 bg-gray-200 mt-1"></div>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 mb-1">
                <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-gray-400 chevron" id="pd-chev-${m.id}"></i>
                <strong class="text-sm">${m.name}</strong>
                <span class="status-pill ${m.status}">${m.status}</span>
                ${agg.blocked > 0 ? `<span class="el-tag danger" style="height:16px;font-size:10px;padding:0 4px"><i data-lucide="alert-octagon" class="w-2.5 h-2.5 inline"></i>${agg.blocked} 阻塞</span>` : ''}
                ${idx === 4 ? '<span class="el-tag purple">AI 建议提前 3 天</span>' : ''}
              </div>
              <div class="text-xs text-gray-500 mb-2">计划：${m.start_date} ~ ${m.due_date} ｜ 任务 ${agg.total} 个（完成 ${agg.done} · 进行中 ${agg.in_progress} · 阻塞 ${agg.blocked}）</div>
              ${m.health_reason ? `<div class="mb-2 px-2 py-1.5 bg-orange-50 border border-orange-200 rounded text-[11px] text-orange-700 flex items-start gap-1.5 max-w-2xl">
                  <i data-lucide="alert-triangle" class="w-3 h-3 mt-0.5 shrink-0"></i>
                  <span><strong>判定为「有风险」的依据（规则计算）：</strong>${m.health_reason}</span>
                </div>` : ''}
              <!-- 完成情况 -->
              <div class="flex items-center gap-2 max-w-lg mb-1">
                <div class="progress-bar flex-1"><div class="progress-fill ${compColor}" style="width:${agg.completion}%"></div></div>
                <span class="text-xs font-semibold" style="color:${compColor === 'green' ? '#67c23a' : compColor === 'red' ? '#f56c6c' : compColor === 'orange' ? '#e6a23c' : '#409eff'};min-width:38px;text-align:right">${agg.completion}%</span>
              </div>
              <!-- 状态分布迷你条 -->
              <div class="status-stack max-w-lg mb-1" title="done:${agg.done} in_progress:${agg.in_progress} blocked:${agg.blocked} review:${agg.review} todo:${agg.todo} backlog:${agg.backlog}">
                ${agg.done ? `<span class="seg-done" style="width:${statusSegPct(agg.done, agg.total)}%"></span>` : ''}
                ${agg.in_progress ? `<span class="seg-in_progress" style="width:${statusSegPct(agg.in_progress, agg.total)}%"></span>` : ''}
                ${agg.blocked ? `<span class="seg-blocked" style="width:${statusSegPct(agg.blocked, agg.total)}%"></span>` : ''}
                ${agg.review ? `<span class="seg-review" style="width:${statusSegPct(agg.review, agg.total)}%"></span>` : ''}
                ${agg.todo ? `<span class="seg-todo" style="width:${statusSegPct(agg.todo, agg.total)}%"></span>` : ''}
                ${agg.backlog ? `<span class="seg-backlog" style="width:${statusSegPct(agg.backlog, agg.total)}%"></span>` : ''}
              </div>
              <!-- AI 预测 + 操作 -->
              <div class="flex items-center gap-3 text-xs">
                <span class="flex items-center gap-1 text-gray-500"><i data-lucide="sparkles" class="w-3 h-3 text-purple-500"></i>AI 预计：<strong style="color:${pred.color}">${pred.date}</strong> <span class="text-gray-400">（${pred.label}）</span></span>
                <span class="text-gray-400">${agg.totalHours}h 估时 / ${agg.doneHours}h 已投</span>
              </div>
            </div>
            <div class="text-xs text-gray-400 self-center"><i data-lucide="chevron-right" class="w-4 h-4"></i></div>
          </div>
          <div id="pd-acc-${m.id}" class="hidden accordion-content" style="background:#fafbfc">
            ${tasks.length === 0 ? emptyState : `
              <div class="flex items-center gap-2 mb-2 text-xs text-gray-500">
                <i data-lucide="list-checks" class="w-3.5 h-3.5"></i>
                <strong>${tasks.length} 个任务</strong>
                <span class="ml-3">完成 ${agg.done} · 阻塞 ${agg.blocked} · 进行中 ${agg.in_progress}</span>
                <button class="ml-auto text-blue-500 hover:underline flex items-center gap-1" onclick="event.stopPropagation();location.href='task-board.html?from=project-detail&milestone=${m.id}'">
                  <i data-lucide="external-link" class="w-3 h-3"></i> 在看板上查看
                </button>
              </div>
              <table class="w-full">
                <thead class="text-gray-500 text-[10px]">
                  <tr>
                    <th class="text-left py-1.5 px-3 pl-12 font-medium">任务</th>
                    <th class="text-left py-1.5 px-3 font-medium">状态</th>
                    <th class="text-left py-1.5 px-3 font-medium">负责人</th>
                    <th class="text-left py-1.5 px-3 font-medium">估时/实际</th>
                    <th class="text-right py-1.5 px-3 font-medium">操作</th>
                  </tr>
                </thead>
                <tbody>${taskRows}</tbody>
              </table>
            `}
          </div>
        `;
      }).join('');
      return items;
    }

    // 任务统计 KPI（动态）
    function renderTaskStats() {
      const ms = getMilestonesOf(currentProjectId);
      const tasks = allTasks.filter(t => ms.some(m => m.id === t.milestone_id));
      const agg = aggregate(tasks);
      return `
        <div class="text-center p-3 bg-gray-50 rounded"><div class="kpi-value">${agg.total}</div><div class="kpi-label">总任务</div></div>
        <div class="text-center p-3 bg-green-50 rounded"><div class="kpi-value text-green-500">${agg.done}</div><div class="kpi-label">已完成</div></div>
        <div class="text-center p-3 bg-orange-50 rounded"><div class="kpi-value text-orange-500">${agg.in_progress}</div><div class="kpi-label">进行中</div></div>
        <div class="text-center p-3 bg-red-50 rounded"><div class="kpi-value text-red-500">${agg.blocked}</div><div class="kpi-label">阻塞</div></div>
        <div class="text-center p-3 bg-blue-50 rounded col-span-4"><div class="text-2xl font-semibold text-blue-500">${agg.completion}%</div><div class="text-xs text-gray-400 mt-1">任务完成率（done / 总） · 估时完成率 ${agg.totalHours ? Math.round(agg.doneHours / agg.totalHours * 100) : 0}%</div></div>
      `;
    }

    aicomLayout(`
    <div class="bg-gray-50">
      <!-- 项目头部 -->
      <div class="bg-white border-b border-gray-200 px-6 py-4">
        <div class="flex items-start justify-between">
          <div>
            <div class="flex items-center gap-2 text-xs text-gray-500 mb-2">
              <span class="font-mono bg-gray-100 px-1.5 py-0.5 rounded">PRJ-2026-Q3-001</span>
              <span class="el-tag success">active</span>
              <span class="el-tag danger">P0</span>
              <span class="health-badge yellow">关注</span>
              <span class="el-tag">财务</span><span class="el-tag">合规</span><span class="el-tag">核心系统</span>
            </div>
            <h1 class="text-2xl font-semibold text-gray-800 mb-2">财务对账系统升级</h1>
            <div class="text-sm text-gray-500">支持 2026 Q3 新会计准则，覆盖 12 个业务线对账自动化</div>
          </div>
          <div class="flex items-center gap-2">
            <button class="btn btn-default btn-sm"><i data-lucide="star" class="w-3.5 h-3.5"></i>关注</button>
            <button class="btn btn-default btn-sm"><i data-lucide="share-2" class="w-3.5 h-3.5"></i>分享</button>
            <button class="btn btn-default btn-sm"><i data-lucide="more-horizontal" class="w-3.5 h-3.5"></i></button>
            <button class="btn btn-primary btn-sm"><i data-lucide="edit" class="w-3.5 h-3.5"></i>编辑</button>
          </div>
        </div>

        <!-- 元信息 -->
        <div class="mt-4 grid grid-cols-6 gap-3 text-xs">
          <div class="bg-gray-50 rounded p-2"><div class="text-gray-400 mb-0.5">PM</div><div class="flex items-center gap-1.5 mt-0.5"><div class="avatar avatar-c3" style="width:22px;height:22px;font-size:11px">王</div><span class="font-medium">王芳</span></div></div>
          <div class="bg-gray-50 rounded p-2"><div class="text-gray-400 mb-0.5">起止日期</div><div class="font-medium mt-0.5">2026-06-15 ~ 09-30</div></div>
          <div class="bg-gray-50 rounded p-2"><div class="text-gray-400 mb-0.5">模板</div><div class="font-medium mt-0.5">财务对账 v1.0</div></div>
          <div class="bg-gray-50 rounded p-2"><div class="text-gray-400 mb-0.5">团队</div><div class="font-medium mt-0.5 flex items-center">5 人 <span class="ml-2 flex"><div class="avatar avatar-c3" style="width:18px;height:18px;font-size:10px;border:2px solid #fff">王</div><div class="avatar avatar-c4" style="width:18px;height:18px;font-size:10px;border:2px solid #fff;margin-left:-6px">赵</div><div class="avatar avatar-c5" style="width:18px;height:18px;font-size:10px;border:2px solid #fff;margin-left:-6px">刘</div><div class="avatar avatar-c6" style="width:18px;height:18px;font-size:10px;border:2px solid #fff;margin-left:-6px">陈</div></span></div></div>
          <div class="bg-gray-50 rounded p-2"><div class="text-gray-400 mb-0.5">预算使用</div><div class="font-medium mt-0.5">71% / ¥1.4M</div></div>
          <div class="bg-gray-50 rounded p-2"><div class="text-gray-400 mb-0.5">可见性</div><div class="font-medium mt-0.5">internal</div></div>
        </div>
      </div>

      <!-- Tab -->
      <div class="bg-white border-b border-gray-200 px-6">
        <div class="flex items-center" data-tabs>
          <button data-tab="overview" class="tab-btn">概览</button>
          <button data-tab="milestone" class="tab-btn active">里程碑时间线</button>
          <button data-tab="task" class="tab-btn">任务 <span class="text-xs text-gray-400">(${allTasks.filter(t => getMilestonesOf(currentProjectId).some(m=>m.id===t.milestone_id)).length})</span></button>
          <button data-tab="risk" class="tab-btn">风险 <span class="el-tag danger" style="height:16px;font-size:10px;padding:0 4px">2</span></button>
          <button data-tab="comment" class="tab-btn">评论 <span class="text-xs text-gray-400">(15)</span></button>
          <button data-tab="progress" class="tab-btn">进度</button>
        </div>
      </div>

      <div class="p-6 space-y-4">
        <!-- 里程碑时间线 Tab（默认） -->
        <div data-panel="milestone">
          <div class="card">
            <div class="card-title">
              <i data-lucide="flag" class="w-4 h-4 text-orange-500"></i> 里程碑时间线 · 任务完成情况
              <div class="ml-auto flex gap-2 items-center">
                <span class="text-xs text-gray-500 flex items-center gap-1"><i data-lucide="mouse-pointer-click" class="w-3 h-3"></i> 点击行展开该里程碑的任务</span>
                <span class="el-tag purple">AI 预测达成：2026-09-28 (p50) / 10-05 (p90)</span>
                <button class="btn btn-default btn-sm"><i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>重新预测</button>
                <button class="btn btn-primary btn-sm"><i data-lucide="plus" class="w-3.5 h-3.5"></i>新建里程碑</button>
              </div>
            </div>

            <div class="space-y-0" id="ms-timeline-container">
              ${renderMilestoneTimeline()}
            </div>
          </div>

          <!-- 任务统计 + 风险摘要 -->
          <div class="grid grid-cols-3 gap-4 mt-4">
            <div class="card col-span-2">
              <div class="card-title"><i data-lucide="bar-chart" class="w-4 h-4 text-blue-500"></i> 任务统计</div>
              <div class="grid grid-cols-4 gap-3" id="task-stats-container">
                ${renderTaskStats()}
              </div>
              <div class="mt-3 text-center">
                <button onclick="location.href='task-board.html?from=project-detail'" class="btn btn-default btn-sm">查看任务看板 →</button>
              </div>
            </div>
            <div class="card">
              <div class="card-title"><i data-lucide="alert-triangle" class="w-4 h-4 text-red-500"></i> 风险摘要 <span class="ml-auto el-tag danger">2 红</span></div>
              <div class="space-y-2 text-xs">
                <div class="p-2 border border-red-200 bg-red-50 rounded"><div class="flex justify-between"><strong>P0 · 高</strong><span class="text-red-500 font-medium">score 20</span></div><div class="mt-1">预付款幂等设计缺陷可能导致重复支付</div></div>
                <div class="p-2 border border-orange-200 bg-orange-50 rounded"><div class="flex justify-between"><strong>P1 · 中</strong><span class="text-orange-500 font-medium">score 9</span></div><div class="mt-1">12 业务线蓝图签字延迟</div></div>
                <div class="p-2 border border-yellow-200 bg-yellow-50 rounded"><div class="flex justify-between"><strong>P2 · 中</strong><span class="text-yellow-600 font-medium">score 12</span></div><div class="mt-1">合规审计对账口径不一致</div></div>
              </div>
              <div class="mt-3 text-center">
                <button onclick="location.href='risks.html?from=project-detail'" class="btn btn-default btn-sm">查看全部风险 →</button>
              </div>
            </div>
          </div>
        </div>

        <!-- 概览 Tab -->
        <div data-panel="overview" class="hidden">
          <div class="grid grid-cols-3 gap-4">
            <div class="card col-span-2">
              <div class="card-title">项目描述</div>
              <p class="text-sm text-gray-600 leading-relaxed">2026 年第三季度财务对账系统升级，覆盖 12 个业务线对账自动化。核心目标：① 与新会计准则对齐；② 实现预付款/开票/对账全流程自动化；③ 通过合规审计二期验收。团队 5 人，预计工期 16 周。</p>
            </div>
            <div class="card">
              <div class="card-title">项目活动</div>
              <ul class="text-xs space-y-2 text-gray-600">
                <li class="flex gap-2"><i data-lucide="message-square" class="w-3 h-3 mt-0.5 text-blue-500"></i>王芳 评论了里程碑 2</li>
                <li class="flex gap-2"><i data-lucide="check-circle" class="w-3 h-3 mt-0.5 text-green-500"></i>刘洋 完成任务 #1001</li>
                <li class="flex gap-2"><i data-lucide="upload" class="w-3 h-3 mt-0.5 text-orange-500"></i>张伟 上传了会议纪要</li>
                <li class="flex gap-2"><i data-lucide="alert-triangle" class="w-3 h-3 mt-0.5 text-red-500"></i>AI 识别新风险：ERP 幂等性</li>
              </ul>
            </div>
          </div>
        </div>

        <!-- 任务 Tab 占位 -->
        <div data-panel="task" class="hidden">
          <div class="card text-center py-12 text-gray-500">
            <i data-lucide="kanban-square" class="w-10 h-10 mx-auto text-gray-300"></i>
            <p class="mt-2">任务管理请前往 <a href="task-board.html?from=project-detail" class="text-blue-500">任务看板</a> 或 <a href="task-list.html?from=project-detail" class="text-blue-500">任务列表</a></p>
          </div>
        </div>

        <!-- 风险 Tab 占位 -->
        <div data-panel="risk" class="hidden">
          <div class="card text-center py-12 text-gray-500">
            <i data-lucide="alert-triangle" class="w-10 h-10 mx-auto text-gray-300"></i>
            <p class="mt-2">查看 <a href="risks.html?from=project-detail" class="text-blue-500">风险登记册</a></p>
          </div>
        </div>

        <!-- 评论 Tab 占位 -->
        <div data-panel="comment" class="hidden">
          <div class="card text-center py-12 text-gray-500">
            <i data-lucide="message-square" class="w-10 h-10 mx-auto text-gray-300"></i>
            <p class="mt-2">查看 <a href="comments.html?from=project-detail" class="text-blue-500">评论中心</a></p>
          </div>
        </div>

        <!-- 进度 Tab -->
        <div data-panel="progress" class="hidden">
          <div class="card mb-4">
            <div class="card-title">
              <i data-lucide="gauge" class="w-4 h-4 text-purple-500"></i> ETA 达成预测
