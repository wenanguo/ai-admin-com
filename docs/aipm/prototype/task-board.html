<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务看板 · aicomm</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/partials.js"></script>
  <script src="assets/js/app.js"></script>
</head>
<body>
  <div id="app" class="h-screen flex"></div>
  <div id="ai-fab"></div>

  <script>
    const tasks = window.MOCK.tasks;
    const users = window.MOCK.users;

    // 按状态分组
    const cols = [
      { id: 'backlog', label: 'Backlog', color: '#909399', icon: 'inbox' },
      { id: 'todo', label: 'Todo', color: '#409EFF', icon: 'circle' },
      { id: 'in_progress', label: 'In Progress', color: '#E6A23C', icon: 'play-circle' },
      { id: 'blocked', label: 'Blocked', color: '#F56C6C', icon: 'octagon' },
      { id: 'review', label: 'Review', color: '#7C3AED', icon: 'eye' },
      { id: 'done', label: 'Done', color: '#67C23A', icon: 'check-circle' }
    ];

    function userById(id) {
      return users.find(u => u.id === id) || { name: '?', avatar: '?', color: '#909399' };
    }

    function taskCard(t) {
      const u = userById(t.assignee_id);
      return `
        <div class="task-card bg-white rounded p-2.5 mb-2 border border-gray-200 hover:border-blue-300">
          <div class="flex items-start gap-2">
            <div class="priority-bar priority-${t.priority}"></div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-1.5 mb-1.5 flex-wrap">
                <span class="el-tag" style="height:18px;font-size:10px;padding:0 4px">${t.priority}</span>
                ${t.ai && t.ai.suggested ? `<span class="el-tag purple" style="height:18px;font-size:10px;padding:0 4px"><i data-lucide="sparkles" class="w-2.5 h-2.5 inline"></i>${t.ai.tag || 'AI'}</span>` : ''}
                <span class="el-tag ${t.type === 'bug' ? 'danger' : t.type === 'feature' ? 'primary' : t.type === 'ops' ? 'info' : ''}" style="height:18px;font-size:10px;padding:0 4px">${t.type}</span>
              </div>
              <div class="text-xs font-medium text-gray-800 leading-snug mb-2">${t.title}</div>
              <div class="flex items-center justify-between text-[11px] text-gray-500">
                <div class="flex items-center gap-1.5">
                  <span class="flex items-center gap-0.5"><i data-lucide="clock" class="w-3 h-3"></i>${t.estimate_hours}h</span>
                  ${t.actual_hours ? `<span class="text-green-500">/ ${t.actual_hours}h</span>` : ''}
                  <span class="flex items-center gap-0.5"><i data-lucide="message-square" class="w-3 h-3"></i>${[1,4,3,0,0,2,1,1,0,0][t.id % 10]}</span>
                </div>
                <div class="avatar" style="width:20px;height:20px;font-size:10px;background:${u.color}">${u.avatar}</div>
              </div>
            </div>
          </div>
        </div>`;
    }

    aicomLayout(`
    <div class="p-6 space-y-4 bg-gray-50">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-xl font-semibold flex items-center gap-2">
            <i data-lucide="kanban-square" class="w-5 h-5 text-blue-500"></i> 任务看板
          </h1>
          <div class="text-xs text-gray-500 mt-1 flex items-center gap-3">
            <select class="el-input" style="width:auto;height:28px"><option>财务对账系统升级 · PRJ-001</option><option>SSO 单点登录接入 · PRJ-002</option></select>
            <span>共 12 个任务 · 已完成 1 · 进行中 2</span>
          </div>
        </div>
        <div class="flex gap-2">
          <div class="flex border border-gray-200 rounded overflow-hidden">
            <button class="px-3 py-1.5 text-xs bg-blue-500 text-white">看板</button>
            <button class="px-3 py-1.5 text-xs bg-white text-gray-600"><a href="task-list.html?from=task-board">列表</a></button>
            <button class="px-3 py-1.5 text-xs bg-white text-gray-600">甘特</button>
          </div>
          <button class="btn btn-default btn-sm"><i data-lucide="filter" class="w-3.5 h-3.5"></i>筛选</button>
          <button class="btn btn-primary btn-sm"><i data-lucide="sparkles" class="w-3.5 h-3.5"></i>AI 拆任务</button>
          <button class="btn btn-primary btn-sm"><i data-lucide="plus" class="w-3.5 h-3.5"></i>新建任务</button>
        </div>
      </div>

      <!-- AI 智能看板提示 -->
      <div class="bg-gradient-to-r from-purple-50 to-blue-50 border border-purple-200 rounded p-3 flex items-start gap-3 text-sm">
        <div class="w-9 h-9 rounded-full bg-gradient-to-br from-purple-500 to-blue-500 flex items-center justify-center text-white"><i data-lucide="bot" class="w-4 h-4"></i></div>
        <div class="flex-1">
          <div class="font-medium">AI 看板洞察</div>
          <ul class="text-xs text-gray-600 mt-1 space-y-0.5">
            <li>• 阻塞列：<strong>任务 #1003</strong> 已被阻塞 3 天，建议转派 <span class="text-blue-500">@刘洋</span> 处理</li>
            <li>• Review 列：<strong>任务 #1005</strong> 已 review 24h 无 Reviewer 响应，建议 ping <span class="text-blue-500">@刘洋</span></li>
            <li>• AI 估时提示：<strong>任务 #2005</strong> 估时 16h 偏高，建议拆为 2 个子任务</li>
          </ul>
        </div>
        <div class="flex gap-1.5">
          <button class="btn btn-default btn-sm">查看详情</button>
          <button class="btn btn-primary btn-sm">采纳</button>
        </div>
      </div>

      <!-- Kanban -->
      <div class="grid grid-cols-6 gap-3 min-h-[500px]">
        ${cols.map(c => {
          const list = tasks.filter(t => t.status === c.id);
          return `
          <div class="bg-gray-100 rounded p-2 kanban-col" style="border-top:3px solid ${c.color}">
            <div class="flex items-center justify-between mb-2 px-1">
              <div class="flex items-center gap-1.5 text-xs font-medium" style="color:${c.color}">
                <i data-lucide="${c.icon}" class="w-3.5 h-3.5"></i>
                ${c.label}
                <span class="text-gray-500 ml-1">${list.length}</span>
              </div>
              <button class="text-gray-400 hover:text-gray-600"><i data-lucide="plus" class="w-3.5 h-3.5"></i></button>
            </div>
            <div class="space-y-1.5 min-h-[200px]">
              ${list.length ? list.map(taskCard).join('') : '<div class="text-xs text-gray-400 text-center py-8 border-2 border-dashed border-gray-300 rounded">拖拽到此</div>'}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>
    `);
    setTimeout(() => { if (window.lucide) lucide.createIcons(); }, 50);
  </script>
</body>
</html>
