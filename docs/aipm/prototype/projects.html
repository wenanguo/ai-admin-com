<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目管理 · aicomm</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/partials.js"></script>
  <script src="assets/js/app.js"></script>
</head>
<body>
  <div id="app" class="h-screen flex"></div>
  <div id="ai-fab"></div>

  <script>
    aicomLayout(`
    <div class="p-6 space-y-4 bg-gray-50">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-xl font-semibold text-gray-800 flex items-center gap-2">
            <i data-lucide="folder-kanban" class="w-5 h-5 text-blue-500"></i> 项目管理
          </h1>
          <div class="text-xs text-gray-500 mt-1">共 18 个项目 · 活跃 14 · 计划中 2 · 已完成 2</div>
        </div>
        <div class="flex gap-2">
          <button class="btn btn-default btn-sm"><i data-lucide="filter" class="w-3.5 h-3.5"></i>筛选</button>
          <button class="btn btn-default btn-sm"><i data-lucide="download" class="w-3.5 h-3.5"></i>导出</button>
          <button class="btn btn-primary btn-sm"><i data-lucide="plus" class="w-3.5 h-3.5"></i>新建项目</button>
        </div>
      </div>

      <!-- 筛选条 -->
      <div class="card flex items-center gap-3 flex-wrap">
        <div class="flex items-center gap-1.5"><span class="text-xs text-gray-500">状态</span>
          <button class="el-tag primary">全部 18</button>
          <button class="el-tag">planning 2</button>
          <button class="el-tag success">active 14</button>
          <button class="el-tag warning">on_hold 1</button>
          <button class="el-tag info">completed 1</button>
        </div>
        <div class="flex items-center gap-1.5"><span class="text-xs text-gray-500">优先级</span>
          <select class="el-input" style="width:auto"><option>全部</option><option>P0</option><option>P1</option></select>
        </div>
        <div class="flex items-center gap-1.5"><span class="text-xs text-gray-500">PM</span>
          <select class="el-input" style="width:auto"><option>全部 PM</option><option>王芳</option><option>李军</option></select>
        </div>
        <div class="flex items-center gap-1.5"><span class="text-xs text-gray-500">标签</span>
          <div class="el-tag purple">AI 推荐模板</div>
          <button class="el-tag">财务</button>
          <button class="el-tag">基建</button>
          <button class="el-tag">营销</button>
        </div>
        <div class="ml-auto flex border border-gray-200 rounded overflow-hidden">
          <button id="btn-list" class="px-3 py-1.5 text-xs bg-blue-500 text-white"><i data-lucide="list" class="w-3 h-3 inline"></i> 列表</button>
          <button id="btn-board" class="px-3 py-1.5 text-xs bg-white text-gray-600"><i data-lucide="kanban" class="w-3 h-3 inline"></i> 看板</button>
          <button id="btn-gallery" class="px-3 py-1.5 text-xs bg-white text-gray-600"><i data-lucide="layout-grid" class="w-3 h-3 inline"></i> 组合</button>
        </div>
      </div>

      <!-- 列表视图 -->
      <div id="view-list" class="card p-0">
        <table class="w-full text-xs">
          <thead class="text-gray-500 bg-gray-50">
            <tr>
              <th class="text-left py-3 px-3 w-8"><input type="checkbox"></th>
              <th class="text-left py-3 px-3">项目编码</th>
              <th class="text-left py-3 px-3">项目名称</th>
              <th class="text-left py-3 px-3">PM</th>
              <th class="text-left py-3 px-3">状态</th>
              <th class="text-left py-3 px-3">优先级</th>
              <th class="text-left py-3 px-3">健康度</th>
              <th class="text-left py-3 px-3 w-1/5">进度</th>
              <th class="text-left py-3 px-3">截止</th>
              <th class="text-left py-3 px-3">标签</th>
              <th class="text-left py-3 px-3">操作</th>
            </tr>
          </thead>
          <tbody>
            ${[
              {c:'PRJ-2026-Q3-001', n:'财务对账系统升级', p:3, s:'active', pr:'P0', h:'yellow', pc:62, d:'09-30', t:['财务','合规','核心系统'], ai:true},
              {c:'PRJ-2026-Q3-002', n:'SSO 单点登录接入', p:2, s:'active', pr:'P0', h:'green', pc:45, d:'08-15', t:['基建','安全'], ai:false},
              {c:'PRJ-2026-Q3-003', n:'数字化营销活动平台', p:2, s:'active', pr:'P1', h:'red', pc:35, d:'07-30', t:['营销','C端'], ai:true},
              {c:'PRJ-2026-Q3-004', n:'合规审计二期', p:3, s:'planning', pr:'P1', h:'green', pc:5, d:'11-30', t:['合规','安全'], ai:false},
              {c:'PRJ-2026-Q3-005', n:'客户交付中台', p:1, s:'active', pr:'P2', h:'yellow', pc:52, d:'10-15', t:['客户','B端'], ai:false}
            ].map(r => `
              <tr class="border-t border-gray-100 hover:bg-blue-50/40 cursor-pointer" onclick="location.href='project-detail.html?from=projects&id=1'">
                <td class="py-3 px-3"><input type="checkbox" onclick="event.stopPropagation()"></td>
                <td class="py-3 px-3 font-mono text-gray-500">${r.c}</td>
                <td class="py-3 px-3 font-medium text-gray-800 flex items-center gap-2">${r.n} ${r.ai ? '<span class="el-tag purple" style="height:18px;font-size:10px;padding:0 4px">AI</span>' : ''}</td>
                <td class="py-3 px-3"><div class="flex items-center gap-1.5"><div class="avatar avatar-c${r.p}" style="width:22px;height:22px;font-size:11px">${'张王李赵刘'[r.p-1]||'陈'}</div><span class="text-gray-600">${['张伟','李军','王芳','赵磊','刘洋'][r.p-1]||'陈敏'}</span></div></td>
                <td class="py-3 px-3"><span class="el-tag ${r.s === 'active' ? 'success' : r.s === 'planning' ? 'info' : ''}">${r.s}</span></td>
                <td class="py-3 px-3"><span class="font-medium text-${r.pr === 'P0' ? 'red' : r.pr === 'P1' ? 'orange' : 'blue'}-500">${r.pr}</span></td>
                <td class="py-3 px-3"><span class="health-badge ${r.h}">${r.h === 'green' ? '健康' : r.h === 'yellow' ? '关注' : '风险'}</span></td>
                <td class="py-3 px-3">
                  <div class="flex items-center gap-2">
                    <div class="flex-1 h-1.5 bg-gray-100 rounded overflow-hidden"><div class="h-full" style="width:${r.pc}%;background:${r.h === 'red' ? '#F56C6C' : r.h === 'yellow' ? '#E6A23C' : '#67C23A'}"></div></div>
                    <span class="text-xs text-gray-500">${r.pc}%</span>
                  </div>
                </td>
                <td class="py-3 px-3 text-gray-500">${r.d}</td>
                <td class="py-3 px-3"><div class="flex gap-1 flex-wrap">${r.t.map(t => `<span class="el-tag">${t}</span>`).join('')}</div></td>
                <td class="py-3 px-3 text-gray-400"><i data-lucide="more-horizontal" class="w-4 h-4"></i></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        <div class="border-t border-gray-100 px-4 py-3 flex items-center text-xs text-gray-500">
          <span>共 18 条 · 每页 20</span>
          <div class="ml-auto flex items-center gap-2"><button class="btn btn-default btn-sm">上一页</button><button class="btn btn-primary btn-sm">1</button><button class="btn btn-default btn-sm">2</button><button class="btn btn-default btn-sm">下一页</button></div>
        </div>
      </div>

      <!-- 看板视图 -->
      <div id="view-board" class="hidden grid grid-cols-4 gap-4">
        ${['planning', 'active', 'on_hold', 'completed'].map(st => `
          <div class="card">
            <div class="flex items-center justify-between mb-3">
              <div class="font-medium text-sm text-gray-800 flex items-center gap-2">
                <span class="status-pill ${st === 'completed' ? 'done' : st === 'active' ? 'in_progress' : st === 'planning' ? 'todo' : ''}">${st}</span>
                <span class="text-gray-400 text-xs">${st === 'planning' ? 2 : st === 'active' ? 14 : st === 'on_hold' ? 1 : 1}</span>
              </div>
              <button class="text-gray-400 hover:text-gray-600"><i data-lucide="plus" class="w-4 h-4"></i></button>
            </div>
            <div class="space-y-2">
              ${st === 'active' ? `
                <div class="p-3 bg-yellow-50 border border-yellow-200 rounded cursor-pointer hover:shadow-md" onclick="location.href='project-detail.html?from=projects&id=1'">
                  <div class="flex items-center gap-1.5 mb-1"><span class="el-tag warning" style="height:18px;font-size:10px">P0</span><span class="text-xs text-gray-400">截止 09-30</span></div>
                  <div class="text-sm font-medium">财务对账系统升级</div>
                  <div class="flex items-center justify-between mt-2 text-xs">
                    <div class="flex items-center gap-1"><div class="avatar avatar-c3" style="width:20px;height:20px;font-size:10px">王</div><div class="avatar avatar-c4" style="width:20px;height:20px;font-size:10px;margin-left:-6px">赵</div></div>
                    <div class="text-gray-500">62%</div>
                  </div>
                </div>
                <div class="p-3 bg-green-50 border border-green-200 rounded cursor-pointer hover:shadow-md" onclick="location.href='project-detail.html?from=projects&id=2'">
                  <div class="flex items-center gap-1.5 mb-1"><span class="el-tag danger" style="height:18px;font-size:10px">P0</span><span class="text-xs text-gray-400">截止 08-15</span></div>
                  <div class="text-sm font-medium">SSO 单点登录接入</div>
                  <div class="flex items-center justify-between mt-2 text-xs">
                    <div class="flex items-center gap-1"><div class="avatar avatar-c2" style="width:20px;height:20px;font-size:10px">李</div></div>
                    <div class="text-gray-500">45%</div>
                  </div>
                </div>
                <div class="p-3 bg-red-50 border border-red-200 rounded cursor-pointer hover:shadow-md" onclick="location.href='project-detail.html?from=projects&id=3'">
                  <div class="flex items-center gap-1.5 mb-1"><span class="el-tag warning" style="height:18px;font-size:10px">P1</span><span class="el-tag purple" style="height:18px;font-size:10px">AI 风险</span></div>
                  <div class="text-sm font-medium">数字化营销活动平台</div>
                  <div class="flex items-center justify-between mt-2 text-xs">
                    <div class="flex items-center gap-1"><div class="avatar avatar-c2" style="width:20px;height:20px;font-size:10px">李</div></div>
                    <div class="text-red-500 font-medium">35%</div>
                  </div>
                </div>
                <div class="p-3 bg-yellow-50 border border-yellow-200 rounded cursor-pointer hover:shadow-md" onclick="location.href='project-detail.html?from=projects&id=5'">
                  <div class="flex items-center gap-1.5 mb-1"><span class="el-tag" style="height:18px;font-size:10px">P2</span><span class="text-xs text-gray-400">截止 10-15</span></div>
                  <div class="text-sm font-medium">客户交付中台</div>
                  <div class="flex items-center justify-between mt-2 text-xs">
                    <div class="flex items-center gap-1"><div class="avatar avatar-c1" style="width:20px;height:20px;font-size:10px">张</div></div>
                    <div class="text-gray-500">52%</div>
                  </div>
                </div>
              ` : ''}
              ${st === 'planning' ? `
                <div class="p-3 bg-blue-50 border border-blue-200 rounded cursor-pointer">
                  <div class="flex items-center gap-1.5 mb-1"><span class="el-tag warning" style="height:18px;font-size:10px">P1</span></div>
                  <div class="text-sm font-medium">合规审计二期</div>
                  <div class="text-xs text-gray-500 mt-1">计划 07-01 开始</div>
                </div>
              ` : ''}
              ${st === 'completed' ? `
                <div class="p-3 bg-green-50 border border-green-200 rounded cursor-pointer opacity-70">
                  <div class="text-sm font-medium text-gray-500 line-through">OA 迁移项目</div>
                  <div class="text-xs text-gray-400 mt-1">已交付</div>
                </div>
              ` : ''}
            </div>
          </div>
        `).join('')}
      </div>

      <!-- 组合视图 -->
      <div id="view-gallery" class="hidden grid grid-cols-3 gap-4">
        ${[
          {n:'财务对账系统升级', h:'yellow', pc:62, code:'PRJ-001', pm:'王芳'},
          {n:'SSO 单点登录接入', h:'green', pc:45, code:'PRJ-002', pm:'李军'},
          {n:'数字化营销活动平台', h:'red', pc:35, code:'PRJ-003', pm:'李军'},
          {n:'合规审计二期', h:'green', pc:5, code:'PRJ-004', pm:'王芳'},
          {n:'客户交付中台', h:'yellow', pc:52, code:'PRJ-005', pm:'张伟'}
        ].map(p => `
          <div class="card cursor-pointer hover:shadow-lg" onclick="location.href='project-detail.html?from=projects&id=1'">
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-mono text-gray-400">${p.code}</span>
              <span class="health-badge ${p.h}">${p.h === 'green' ? '健康' : p.h === 'yellow' ? '关注' : '风险'}</span>
            </div>
            <div class="text-base font-medium text-gray-800 mb-2">${p.n}</div>
            <div class="text-xs text-gray-500 mb-3 flex items-center gap-1.5"><i data-lucide="user" class="w-3 h-3"></i> PM ${p.pm}</div>
            <div class="flex items-center justify-between text-xs"><span class="text-gray-500">进度</span><span class="font-medium">${p.pc}%</span></div>
            <div class="h-1.5 bg-gray-100 rounded overflow-hidden mt-1"><div class="h-full" style="width:${p.pc}%;background:${p.h === 'red' ? '#F56C6C' : p.h === 'yellow' ? '#E6A23C' : '#67C23A'}"></div></div>
            <div class="mt-3 pt-3 border-t border-gray-100 flex items-center justify-between text-xs text-gray-500">
              <span class="flex items-center gap-1"><i data-lucide="message-square" class="w-3 h-3"></i> 23 评论</span>
              <span class="flex items-center gap-1"><i data-lucide="alert-triangle" class="w-3 h-3"></i> 2 风险</span>
              <span class="flex items-center gap-1"><i data-lucide="calendar" class="w-3 h-3"></i> 截止 09-30</span>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
    `);

    // 视图切换
    function bindView(id) {
      document.getElementById(id).addEventListener('click', () => {
        ['list', 'board', 'gallery'].forEach(v => {
          document.getElementById('view-' + v).classList.toggle('hidden', v !== id.replace('btn-', ''));
        });
        ['list', 'board', 'gallery'].forEach(v => {
          const b = document.getElementById('btn-' + v);
          b.className = 'px-3 py-1.5 text-xs ' + (v === id.replace('btn-', '') ? 'bg-blue-500 text-white' : 'bg-white text-gray-600');
        });
      });
    }
    setTimeout(() => {
      bindView('btn-list'); bindView('btn-board'); bindView('btn-gallery');
      if (window.lucide) lucide.createIcons();
    }, 50);
  </script>
</body>
</html>
