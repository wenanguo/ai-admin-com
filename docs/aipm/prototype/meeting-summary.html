<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会议纪要总结 · aicomm</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/partials.js"></script>
  <script src="assets/js/app.js"></script>
</head>
<body>
  <div id="app" class="h-screen flex"></div>
  <div id="ai-fab"></div>

  <script>
    aicomLayout(`
    <div class="p-6 space-y-4 bg-gray-50">
      <div>
        <h1 class="text-xl font-semibold flex items-center gap-2">
          <i data-lucide="file-audio" class="w-5 h-5 text-blue-500"></i> 会议纪要总结
          <span class="el-tag purple">结构化抽取 F1 0.82</span>
        </h1>
        <div class="text-xs text-gray-500 mt-1">上传录音或转写文本 · AI 自动抽取 Action Items / Risks / Decisions / Questions</div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <!-- 左侧：上传 + 转写 -->
        <div class="space-y-3">
          <div class="card">
            <div class="card-title"><i data-lucide="upload" class="w-4 h-4 text-blue-500"></i> 上传会议录音或转写</div>
            <div class="border-2 border-dashed border-gray-300 rounded p-8 text-center hover:border-blue-400 hover:bg-blue-50/30 transition cursor-pointer">
              <i data-lucide="cloud-upload" class="w-12 h-12 mx-auto text-gray-300"></i>
              <div class="text-sm text-gray-600 mt-2">点击或拖拽 <strong>音频 / 视频 / 文本文件</strong> 到此区域</div>
              <div class="text-xs text-gray-400 mt-1">支持 .mp3 / .m4a / .wav / .txt · 单文件 ≤ 200 MB · 时长 ≤ 4 小时</div>
              <div class="mt-3">
                <button class="btn btn-primary btn-sm"><i data-lucide="upload" class="w-3.5 h-3.5"></i>选择文件</button>
                <button class="btn btn-default btn-sm ml-2"><i data-lucide="link" class="w-3.5 h-3.5"></i>飞书妙记链接</button>
                <button class="btn btn-default btn-sm ml-2"><i data-lucide="link" class="w-3.5 h-3.5"></i>钉钉闪记</button>
              </div>
            </div>
            <div class="mt-3 p-2 bg-yellow-50 border border-yellow-200 rounded text-xs text-yellow-700 flex items-start gap-2">
              <i data-lucide="shield" class="w-4 h-4 mt-0.5"></i>
              <span>会议录音上传需确认隐私合规，已自动脱敏 PII（手机号 / 邮箱 / 身份证）</span>
            </div>
          </div>

          <div class="card">
            <div class="card-title"><i data-lucide="file-text" class="w-4 h-4 text-blue-500"></i> 当前文件</div>
            <div class="p-3 border border-blue-200 rounded bg-blue-50/50 flex items-center gap-3">
              <div class="w-10 h-10 rounded bg-blue-500 text-white flex items-center justify-center"><i data-lucide="file-audio" class="w-5 h-5"></i></div>
              <div class="flex-1 min-w-0">
                <div class="text-sm font-medium truncate">财务对账系统 6-29 进度同步会.m4a</div>
                <div class="text-xs text-gray-500">60 分钟 · 12 MB · 已转写</div>
              </div>
              <button class="text-gray-400 hover:text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
            </div>
            <div class="mt-3 space-y-1 text-xs text-gray-500">
              <div class="flex items-center gap-2"><i data-lucide="check-circle" class="w-3 h-3 text-green-500"></i>音频转写（Whisper）</div>
              <div class="flex items-center gap-2"><i data-lucide="check-circle" class="w-3 h-3 text-green-500"></i>说话人分离（4 人）</div>
              <div class="flex items-center gap-2"><i data-lucide="loader" class="w-3 h-3 text-blue-500 animate-spin"></i>AI 结构化抽取</div>
            </div>
          </div>

          <div class="card">
            <div class="card-title"><i data-lucide="scroll" class="w-4 h-4 text-blue-500"></i> 转写文本</div>
            <div class="p-3 bg-gray-900 text-green-300 rounded font-mono text-xs overflow-y-auto max-h-64">
              <div>[王芳 11:02:15]</div>
              <div>今天开进度同步会。我先说一下当前状态……</div>
              <div class="text-blue-300">[刘洋 11:03:42]</div>
              <div>好的，里程碑 2 预付款模块进度 62%，但任务 #1003 幂等性设计被阻塞，需要 @刘洋 配合 ERP 接口方对方案。</div>
              <div class="text-blue-300">[王芳 11:05:10]</div>
              <div>@刘洋 你明天能提交一份 idempotency-key 的 PR 吗？</div>
              <div class="text-blue-300">[刘洋 11:05:30]</div>
              <div>收到，我下午准备。</div>
              <div class="text-blue-300">[张伟 11:08:00]</div>
              <div>会议上大家有没有其他风险？我担心的是 12 业务线蓝图签字延迟……</div>
              <div class="text-blue-300">[陈敏 11:10:15]</div>
              <div>UAT 测试用例评审预计 7/10 完成……</div>
            </div>
          </div>
        </div>

        <!-- 右侧：AI 抽取结构 -->
        <div class="space-y-3">
          <div class="card border-purple-200 bg-gradient-to-br from-purple-50/50 to-blue-50/30">
            <div class="card-title">
              <i data-lucide="sparkles" class="w-4 h-4 text-purple-500"></i> AI 结构化抽取
              <span class="ml-auto el-tag purple">Sonnet 4.5 · 3.2s</span>
            </div>

            <!-- 简要 -->
            <div class="mb-3">
              <div class="text-xs font-medium text-gray-600 mb-1">📌 简要总结</div>
              <div class="text-sm">本次会议聚焦财务对账系统 M2 阶段关键路径，明确了 #1003 阻塞任务的解决方案，UAT 时间有望前置。</div>
            </div>

            <!-- Decisions -->
            <div class="mb-3">
              <div class="text-xs font-medium text-gray-700 mb-1.5 flex items-center gap-1"><i data-lucide="check-circle" class="w-3.5 h-3.5 text-green-500"></i> Decisions 决策（2）</div>
              <div class="space-y-1.5">
                <div class="p-2 bg-green-50 border border-green-200 rounded text-xs">
                  <div class="font-medium">采用 UUID idempotency-key + Redis 去重双保险</div>
                  <div class="text-gray-500 mt-0.5">Owner: <span class="text-blue-500">刘洋</span> · Due: 2026-06-30</div>
                </div>
                <div class="p-2 bg-green-50 border border-green-200 rounded text-xs">
                  <div class="font-medium">PMO 介入催办 12 业务线签字</div>
                  <div class="text-gray-500 mt-0.5">Owner: <span class="text-blue-500">张伟</span> · Due: 2026-07-02</div>
                </div>
              </div>
            </div>

            <!-- Action Items -->
            <div class="mb-3">
              <div class="text-xs font-medium text-gray-700 mb-1.5 flex items-center gap-1"><i data-lucide="play-circle" class="w-3.5 h-3.5 text-blue-500"></i> Action Items（3）</div>
              <div class="space-y-1.5">
                <div class="p-2 bg-blue-50 border border-blue-200 rounded text-xs flex items-center justify-between">
                  <div>
                    <div class="font-medium">幂等性设计 PR</div>
                    <div class="text-gray-500 mt-0.5">@刘洋 · <span class="el-tag danger" style="height:16px;font-size:10px;padding:0 4px">P0</span> · 2026-06-30</div>
                  </div>
                  <button class="btn btn-primary btn-sm" onclick="alert('Mock: 已创建任务')"><i data-lucide="plus" class="w-3 h-3"></i>转任务</button>
                </div>
                <div class="p-2 bg-blue-50 border border-blue-200 rounded text-xs flex items-center justify-between">
                  <div>
                    <div class="font-medium">ERP 接口方回滚预案</div>
                    <div class="text-gray-500 mt-0.5">@王芳 · <span class="el-tag warning" style="height:16px;font-size:10px;padding:0 4px">P1</span> · 2026-07-02</div>
                  </div>
                  <button class="btn btn-primary btn-sm"><i data-lucide="plus" class="w-3 h-3"></i>转任务</button>
                </div>
                <div class="p-2 bg-blue-50 border border-blue-200 rounded text-xs flex items-center justify-between">
                  <div>
                    <div class="font-medium">UAT 测试用例评审</div>
                    <div class="text-gray-500 mt-0.5">@陈敏 · <span class="el-tag warning" style="height:16px;font-size:10px;padding:0 4px">P1</span> · 2026-07-10</div>
                  </div>
                  <button class="btn btn-primary btn-sm"><i data-lucide="plus" class="w-3 h-3"></i>转任务</button>
                </div>
              </div>
            </div>

            <!-- Risks -->
            <div class="mb-3">
              <div class="text-xs font-medium text-gray-700 mb-1.5 flex items-center gap-1"><i data-lucide="alert-triangle" class="w-3.5 h-3.5 text-orange-500"></i> Risks（1）</div>
              <div class="p-2 bg-orange-50 border border-orange-200 rounded text-xs">
                <div class="font-medium">ERP 接口幂等性未上线前存在重复支付风险</div>
                <div class="text-gray-500 mt-0.5">Level: high · 关联 <a href="risks.html?from=meeting-summary" class="text-blue-500">R-501</a></div>
              </div>
            </div>

            <!-- Open Questions -->
            <div class="mb-3">
              <div class="text-xs font-medium text-gray-700 mb-1.5 flex items-center gap-1"><i data-lucide="help-circle" class="w-3.5 h-3.5 text-purple-500"></i> Open Questions（1）</div>
              <div class="p-2 bg-purple-50 border border-purple-200 rounded text-xs">
                <div class="font-medium">UAT 提前 3 天是否需要 PMO 审批？</div>
                <button class="text-blue-500 text-xs mt-1">→ @张伟 决定</button>
              </div>
            </div>

            <div class="mt-3 flex gap-2">
              <button class="btn btn-primary btn-sm"><i data-lucide="save" class="w-3.5 h-3.5"></i>保存到 PRJ-001</button>
              <button class="btn btn-default btn-sm"><i data-lucide="file-down" class="w-3.5 h-3.5"></i>导出 PDF</button>
              <button class="btn btn-default btn-sm"><i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>重新抽取</button>
            </div>
          </div>

          <!-- 历史会议 -->
          <div class="card">
            <div class="card-title"><i data-lucide="history" class="w-4 h-4 text-blue-500"></i> 历史会议 <span class="ml-auto text-xs text-gray-500">本月 4 次</span></div>
            <div class="space-y-2 text-xs">
              ${[
                {t:'财务对账系统 6/29 进度同步会', ai:'AI 抽取: 2 决策 / 3 Action / 1 风险 / 1 提问', d:'06-29'},
                {t:'营销活动平台 6/27 启动会', ai:'AI 抽取: 1 决策 / 5 Action / 2 风险', d:'06-27'},
                {t:'SSO 6/25 方案评审', ai:'AI 抽取: 1 决策 / 2 Action / 0 风险', d:'06-25'},
                {t:'合规审计 6/20 Kick-off', ai:'AI 抽取: 0 决策 / 4 Action / 1 风险', d:'06-20'}
              ].map(m => `
                <div class="p-2.5 hover:bg-gray-50 rounded cursor-pointer">
                  <div class="flex items-center gap-2"><i data-lucide="file-audio" class="w-3.5 h-3.5 text-blue-500"></i><span class="font-medium">${m.t}</span><span class="ml-auto text-gray-400">${m.d}</span></div>
                  <div class="text-gray-500 mt-0.5">${m.ai}</div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      </div>
    </div>
    `);
    setTimeout(() => { if (window.lucide) lucide.createIcons(); }, 50);
  </script>
</body>
</html>
