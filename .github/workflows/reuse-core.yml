# 「通用内核可复用」的验收（issue #116）
#
#   static —— 静态断言（示例只用公开入口 / 不碰别的业务系统）⇒ 不需要 docker
#   example —— **真起 compose**（示例系统 + 示例自己的空库 ⇒ 清单能列、命令能调）
#
# ⚠️ 模型 key 由 CI secret 提供；**没有 key 时**也只验到「装配成功」这一步。
name: 内核复用验收

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    name: 静态断言（只用公开入口）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/check-core-reuse.cjs

  example:
    name: 起示例系统验收（真 compose）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # 构建镜像（npm ci + tsc + prisma generate）+ 起 compose + 验收
      - run: node scripts/e2e/reuse-core-example.cjs
        env:
          # ⚠️ 没有这个 secret 时是空串 ⇒ 验收脚本只验到「装配成功」
          MINIMAX_CN_API_KEY: ${{ secrets.MINIMAX_CN_API_KEY }}
