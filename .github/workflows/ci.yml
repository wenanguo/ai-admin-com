name: CI

on: [push, pull_request]

permissions:
  contents: read

defaults:
  run:
    # monorepo 之后前端在 frontend/ 下 => 所有 run 步骤都在那里跑
    working-directory: frontend

jobs:
  # agent 自己的脚本（scripts/agent/**）—— 零依赖，node:test 直接跑。
  # ⚠️ 这些脚本**平时没人跑** ⇒ 它们的 bug（例如 execFileSync 在 inherit 下返回 null
  #    ⇒ 合并脚本在“合并成功后”崩）要等到**真的合并一次**才暴露 ⇒ 必须有 CI 兵。
  agent-scripts:
    name: agent 脚本测试
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test "scripts/agent/*.test.cjs"

  # Node 版本基线（issue #128）—— **静态断言**：
  #   CI 的 Node 版本 / 三个 package.json 的 engines / 三个 Dockerfile 的 NODE_VERSION /
  #   文档里的版本说法 —— 四处不许漂移；
  #   且「依赖树不因升 Node 而变」有**机器可查**的证据（lock 与基线分支逐字段相同，只差 engines）。
  # ⚠️ fetch-depth: 0 ⇒ 拿得到基线分支（origin/main）⇒ lock 比对才有效（否则脚本只警告并跳过）。
  node-baseline:
    name: Node 版本基线
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/e2e/node-version.static.cjs

  # 减法摸底清单（issue #180）—— **静态断言**：
  #   清单（docs/pm/减法摸底-逐文件清单.md）逐文件覆盖 core 的实现文件 · 行数与代码一致 ·
  #   分类只能是三个 · 「还能退给 dsh」必须写出去处 · 死代码必须带 grep 证据 ·
  #   承诺的减法行数能从表里算出来 · 本 PR 不改产品代码。
  # ⚠️ fetch-depth: 0 ⇒ 拿得到基线分支（origin/main）⇒ 「不改产品代码」那条才有效
  #    （否则脚本只警告并跳过）。
  subtraction-inventory:
    name: 减法摸底清单（静态验收）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/e2e/ai-subtraction-inventory.static.cjs

  # MCP 工具快照守卫（issue #182）—— **离线**：
  #   技能正文（.pi/skills/**）里的参数名 / 必填 / 类型 **必须**与入库的
  #   MCP 工具快照一致 ⇒ 后端改了工具而技能没改 ⇒ 这里红。
  # ⚠️ 不需要装依赖、不需要联网、不需要模型凭据 ⇒ 任何 runner 都能跑。
  mcp-tools-snapshot:
    name: MCP 工具快照守卫
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/e2e/mcp-tools-snapshot.static.cjs

  # AI 服务（backend/ai）—— 单测 + **内核纯净度**。
  # ⚠️ 之前后端的 447 条单测**在 CI 里根本没跑**（只有容器验收）⇒ 这里补上。
  # ⚠️ 内核纯净度 = 两档（`core/**` 不许 import `plugins/**` + 代码里不许出现业务词），
  #    都在 `scripts/check-core-purity.cjs` 里。
  ai-service:
    name: AI 服务（单测 + 内核纯净度）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/ai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # ⚠️ **fetch-depth: 0** ⇒ 拿得到基线分支（origin/main）
        #    ⇒ issue #181 的「前端除代理配置外 0 业务改动」那条断言才有效
        #    （否则脚本只警告并跳过）。
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/ai/package-lock.json
      # ⚠️ **钉住 npm 版本**（= 本仓 lock 的生成版本）：node 24 自带 npm 11，
      #    它的「package.json 与 package-lock.json 必须同步」检查比 npm 10 严
      #    ⇒ 可能把现有 lock 判成不同步 ⇒ `npm ci` 直接 EUSAGE。
      #    ⇒ 钉到 10.9.9 ⇒ CI 装出的树与 lock、与镜像完全一致（依赖树不因升 Node 而变）。
      - run: npm install -g npm@10.9.9
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
      - run: node ../../scripts/check-core-purity.cjs
      # dsh 边界（issue #120）：dsh 的类型/包**只许**在适配层
      # （backend/ai/src/core/adapter/dsh/** + backend/ai/dsh-plugin/**）
      # ⇒ dsh 升级的影响面 = 适配层目录。
      - run: node ../../scripts/check-dsh-boundary.cjs
      # dsh 边界的**负例**（issue #123 收尾）：守卫的「放行」不许被改松
      # （dsh 运行时只许在 devDependencies；别的 dsh 包不许进清单）。
      - run: node ../../scripts/e2e/dsh-boundary.static.cjs
      # dsh 底座摸底（issue #119）：版本锁 / 尖峰脚手架 / spec 的**静态**断言
      # ⇒ 不需要装 dsh、不需要模型凭据 ⇒ 任何 runner 都能跑。
      - run: node ../../scripts/e2e/dsh-spike.static.cjs
      # dsh 存储与审计（issue #121）：数据模型**只加不改** / 迁移安全 / 契约不变
      # ⇒ 静态断言（不需要数据库）。
      - run: node ../../scripts/e2e/dsh-storage.static.cjs
      # dsh 技能 / MCP / 插件（issue #122）：三层在 dsh 上的形状
      # ⇒ 静态断言（不需要 pnpm、不需要模型凭据）。
      - run: node ../../scripts/e2e/dsh-skills-mcp-plugins.static.cjs
      # ⚠️ **变量名守卫**（issue #124 阶段三的真 bug）：
      #   dsh 的 app-boot 拒收**任何 .env 文件**里的 `DSH_*`（BOOTSTRAP_PREFIXES）
      #   ⇒ 入库的 .env 模板里**不许**出现 `DSH_` 开头的键（否则照着配就炸）。
      - run: node ../../scripts/e2e/dsh-env-names.static.cjs
      # issue #158：profile 里那份插件拷贝**要跟着插件变**
      #   （旧判据「路径一样就跳过」⇒ 改了插件等于没改 ⇒ 派活报 NO_ADAPTER）
      # ⇒ 验收脚本用「假 pnpm」⇒ **不需要 pnpm、不联网、不需要模型凭据**。
      - run: node ../../scripts/e2e/dsh-profile-refresh.cjs
      # #124 管理面的**运行时**验收（阶段二）：真起 dsh web + 真挂反代
      # ⇒ 断言转发成功 / Host 保留 / cookie Path 改写 / fail closed / 403 / 200
      # ⚠️ **不需要模型凭据、不需要 pnpm、不连数据库** ⇒ 任何 runner 都能跑。
      - run: node ../../scripts/e2e/dsh-admin-runtime.cjs
      # #181 管理面「**浏览器这一层**」的运行时验收：
      #   浏览器 ──▶ 前端 dev 代理（**真的那条规则**）──▶ AI 服务（真的反代）──▶ dsh web（真二进制）
      # ⇒ 断言两边的配置形状 + 穿过两层拿到 dsh 的 SPA + Host 保留 + cookie Path
      #    + 非管理员 403 + 没判定器 503（fail closed）
      # ⚠️ **不需要模型凭据、不需要 pnpm、不连数据库** ⇒ 任何 runner 都能跑。
      - run: node ../../scripts/e2e/dsh-admin-proxy-chain.cjs

  # ⚠️ **减法的行为保证**（issue #153 收尾）：**技能 / MCP / 插件三层的运行时验收**。
  #
  #   为什么单独一个 job（不塞进上面的 ai-service）：
  #   ① 它**要 pnpm**（dsh 的 profile 是个独立的 pnpm 工程 ⇒ 我们的插件要装进去）
  #      ⇒ 而上面那个 job 刻意**不装 pnpm**（它要的是「任何 runner 都能跑」）；
  #   ② 它**慢**（第一次要装 profile 的依赖）⇒ 别拖慢单测那条线；
  #   ③ 它**红的时候要看得懂**（「行为保证没了」≠「单测挂了」）。
  #
  #   它钉住：技能目录**进了模型上下文**（用户消息）+ `skill` 工具在
  #          + MCP 的写操作**被闸门拦下**（拒绝 ⇒ 服务端一次都没被叫）
  #          + 批准 ⇒ MCP 服务器**真的**收到写调用 + 工具名归一化。
  #
  # ⚠️ **不需要模型凭据、不连数据库**（脚本自带假模型服务）⇒ 花钱的是 0。
  # ⚠️ **要联网**（pnpm 从 npm 拉 dsh 的包）—— 这是它与「静态验收」最大的不同。
  ai-dsh-runtime:
    name: AI 运行时验收（技能 / MCP 闸门 · 真起 dsh）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend/ai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/ai/package-lock.json
      # ⚠️ **钉住 npm 版本**（= 本仓 lock 的生成版本）⇒ 装出的树与 lock、与镜像完全一致。
      - run: npm install -g npm@10.9.9
      - run: npm ci
      # ⚠️ **pnpm 的版本要与镜像里那个一致**（`backend/ai/Dockerfile` ⇒ `pnpm@11.22.0`）
      #    ⇒ 不然「本地能装、CI 装不上」⇒ 验收变成薛定谔的。
      - run: npm install -g pnpm@11.22.0 && pnpm -v
      # ⚠️ **第一次跑是冷的**（pnpm 的 store 也是冷的 ⇒ 要下载 dsh 的一堆包）
      #    ⇒ 脚本自己会**先预热**（宽裕的 initialize 超时）⇒ 第一次也是绿的。
      - run: node ../../scripts/e2e/dsh-skills-mcp-plugins.runtime.cjs

  # 独立 dsh 项目（issue #183）—— **静态验收 + 真起 dsh**。
  #
  #   ① 静态：自己的清单 / 自己的 lock / 自己的 profile / 自己的镜像
  #      · 外部插件按 `file:` 引用（**不复制源码**）· 凭据**只走环境变量** · 文档可执行
  #      · **本仓的三个 lock 一个字节没动**（⇒ 独立依赖不进本仓依赖树）
  #   ② 运行时：**真起 dsh 子进程** ⇒ 模型真的被调用（脚本自带**假模型服务** ⇒ 不花钱）
  #
  # ⚠️ **要 pnpm**（dsh 的 profile 是个独立的 pnpm 工程 ⇒ 插件要装进去）
  #    ⇒ 与「静态验收」最大的不同：**要联网**（pnpm 从 npm 拉插件的依赖）。
  # ⚠️ **不需要模型凭据、不连数据库** ⇒ 花钱的是 0。
  dsh-standalone:
    name: 独立 dsh 项目（静态 + 真起 dsh）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # ⚠️ **fetch-depth: 0** ⇒ 拿得到基线分支（origin/main）
        #    ⇒ 「本仓的三个 lock 没被改」那条断言才有效（否则脚本只警告并跳过）。
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dsh/package-lock.json
      # ⚠️ **钉住 npm 版本**（= 本仓 lock 的生成版本）⇒ 装出的树与 lock、与镜像完全一致。
      - run: npm install -g npm@10.9.9
      # ① 静态验收（**不装依赖、不联网、不需要凭据** ⇒ 任何 runner 都能跑）
      - run: node ../scripts/e2e/dsh-standalone.static.cjs
      - run: npm ci
      # ⚠️ **pnpm 的版本要与镜像里那个一致**（`dsh/Dockerfile` ⇒ `pnpm@11.22.0`）
      #    ⇒ 不然「本地能装、CI 装不上」⇒ 验收变成薛定谔的。
      - run: npm install -g pnpm@11.22.0 && pnpm -v
      # ② 运行时验收（真起 dsh ⇒ 模型真的被调用 ⇒ 答案真的回来）
      - run: node ../scripts/e2e/dsh-standalone.cjs

  # 前端抗 flaky（issue #193）—— **同一 commit 连跑 10 次**。
  #
  # 为什么要有它：
  # flaky 的特点是「跑一次绿了不能证明修好了」⇒ 只能靠**连跑很多次**。
  # ⇒ 把这件事接进 CI ⇒ flaky 自己露出来，而不是等人偶然撞上。
  #
  # 跑的是 `frontend/scripts/repeat-vitest.mjs`（#154 入库的脚本）：
  # 任一次失败就立刻停 ⇒ 不用等跑完 10 次。
  #
  # ⚠️ **只跑那个 flaky 文件**，不跑整仓：
  #    整仓连跑 10 次太慢（CI 上整仓一轮 ~65s ⇒ 10 轮 ~11 分钟）；
  #    而 flaky 的触发条件是「同一个文件里的时序」⇒ 单文件连跑就够。
  frontend-flaky-repeat:
    name: 前端抗 flaky（连跑 10 次）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # ⚠️ **钉住 npm 版本**（= 本仓 lock 的生成版本）⇒ 与其它 job 装出同一棵树。
      - run: npm install -g npm@10.9.9
      - run: npm ci
      # ⚠️ 浏览器模式的单测要真的 chromium（coverage.yml 里也是这一步）。
      - run: npx playwright install --with-deps chromium
      - run: node scripts/repeat-vitest.mjs src/pages/module_system/role/PermissionModal.test.tsx 10

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@10.9.9
      - run: npm ci
      - run: npm run biome:lint

  tsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@10.9.9
      - run: npm ci
      - run: npm run tsc

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node_version: [24]
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js ${{ matrix.node_version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@10.9.9
      - run: echo ${{github.ref}}
      - uses: utooland/setup-utoo@e7aa4d726a17f79f68aed736476ea5bd68f8ba52 # v1
        with:
          cache-utoo: false
      - run: ut
      - run: ut lint
      - run: ut build
        env:
          CI: true
          PROGRESS: none
          NODE_ENV: test
          NODE_OPTIONS: --max_old_space_size=4096
