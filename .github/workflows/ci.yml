name: CI

on: [push, pull_request]

permissions:
  contents: read

defaults:
  run:
    # monorepo 之后前端在 frontend/ 下 => 所有 run 步骤都在那里跑
    working-directory: frontend

jobs:
  # agent 自己的脚本（scripts/agent/**）—— 零依赖，node:test 直接跑。
  # ⚠️ 这些脚本**平时没人跑** ⇒ 它们的 bug（例如 execFileSync 在 inherit 下返回 null
  #    ⇒ 合并脚本在“合并成功后”崩）要等到**真的合并一次**才暴露 ⇒ 必须有 CI 兵。
  agent-scripts:
    name: agent 脚本测试
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test "scripts/agent/*.test.cjs"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run biome:lint

  tsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run tsc

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node_version: [22]
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js ${{ matrix.node_version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: echo ${{github.ref}}
      - uses: utooland/setup-utoo@e7aa4d726a17f79f68aed736476ea5bd68f8ba52 # v1
        with:
          cache-utoo: false
      - run: ut
      - run: ut lint
      - run: ut build
        env:
          CI: true
          PROGRESS: none
          NODE_ENV: test
          NODE_OPTIONS: --max_old_space_size=4096
